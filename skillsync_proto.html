/* ---------- Matching algorithm ---------- */
function matchScore(a,b){
  if(!a||!b) return {score:0, twoWay:false, iTeachThem:[], theyTeachMe:[]};
  const aTeachNames = a.teach.map(t=>t.skill.toLowerCase());
  const aLearnNames = a.learn.map(t=>t.skill.toLowerCase());
  const bTeachNames = b.teach.map(t=>t.skill.toLowerCase());
  const bLearnNames = b.learn.map(t=>t.skill.toLowerCase());
  const iTeachThem = a.teach.filter(t=> bLearnNames.includes(t.skill.toLowerCase()));
  const theyTeachMe = b.teach.filter(t=> aLearnNames.includes(t.skill.toLowerCase()));
  let score = 0, twoWay=false;
  if(iTeachThem.length && theyTeachMe.length){
    twoWay = true;
    const extra = Math.max(0, (iTeachThem.length + theyTeachMe.length) - 2);
    score = Math.min(100, 90 + extra*4);
  } else if(iTeachThem.length || theyTeachMe.length){
    const cnt = iTeachThem.length + theyTeachMe.length;
    score = Math.min(80, 55 + cnt*10);
  } else {
    score = 0;
  }
  return {score, twoWay, iTeachThem, theyTeachMe};
}
function allOtherUsers(){
  return Object.values(P.users).filter(u=> u.id !== P.currentUserId);
}
/* Score-ranked matches with Verified-Only applied, but BEFORE the advanced
   "Filter By" filters — used to tell an empty result (no matches at all)
   apart from an empty result caused by the advanced filters. */
/* Interest-aware ranking layer (additive — does not touch matchScore()).
   Default mode (no explicit Interest filter): shared-interest users are
   tiered first, ranked by shared count, then interest %, THEN the existing
   Skill Sync score, then twoWay as a final tie-breaker — so interests
   reorder discovery without ever burying a stronger Skill Sync match behind
   a weaker one within the same tier.
   Explicit Interest filter mode: sort stays pure Skill Sync score (existing
   behavior); applyBuddyFilters() does the narrowing to that one interest. */
function compareRankedMatches(x,y){
  if(!UI.buddyFilters.interest){
    const xShared = x.sharedCount>0?1:0, yShared = y.sharedCount>0?1:0;
    if(xShared!==yShared) return yShared-xShared;
    if(xShared){
      if(y.sharedCount!==x.sharedCount) return y.sharedCount-x.sharedCount;
      if(y.interestScore!==x.interestScore) return y.interestScore-x.interestScore;
    }
  }
  if(y.score!==x.score) return y.score-x.score;
  return (y.twoWay?1:0)-(x.twoWay?1:0);
}
function baseRankedMatches(){
  const myUser = me();
  let list = allOtherUsers()
    .map(u => ({user:u, ...matchScore(myUser, u), ...interestMatchData(myUser, u)}))
    .filter(m => m.score > 0)
    .sort(compareRankedMatches);
  if(UI.verifiedOnlyFilter) list = list.filter(m=> userIsVerifiedPublic(m.user));
  return list;
}
function rankedMatches(){
  // 1) score+verified eligibility, 2) advanced filters remove ineligible buddies,
  // 3) existing Skill Sync score ordering from baseRankedMatches is preserved.
  return applyBuddyFilters(baseRankedMatches());
}

/* ---------- Advanced "Filter By" (Find Your Skill Buddy) ---------- */
const TIME_SLOTS = [
  {key:'morning', label:'Morning', sub:'6 AM–12 PM'},
  {key:'afternoon', label:'Afternoon', sub:'12 PM–4 PM'},
  {key:'evening', label:'Evening', sub:'4 PM–8 PM'},
  {key:'night', label:'Night', sub:'8 PM–12 AM'},
];
const PREF_OPTIONS = [
  {key:'teach', label:'Can teach me'},
  {key:'learn', label:'Wants to learn from me'},
  {key:'mutual', label:'Both / Mutual Skill Exchange'},
];
function hasActiveBuddyFilters(){
  const f = UI.buddyFilters;
  return !!(f.skill || f.level || (f.availability && f.availability.length) || f.pref || f.interest);
}
function timeSlotFor(hhmm){
  const h = Number(String(hhmm||'').split(':')[0]);
  if(isNaN(h)) return null;
  if(h>=6 && h<12) return 'morning';
  if(h>=12 && h<16) return 'afternoon';
  if(h>=16 && h<20) return 'evening';
  if(h>=20 && h<24) return 'night';
  return null;
}
function userAvailableSlots(userId){
  return P.availability.filter(a=> a.userId===userId && a.status==='available');
}
function buddyTimeSlots(userId){
  return new Set(userAvailableSlots(userId).map(a=> timeSlotFor(a.startTime)).filter(Boolean));
}
function timeRangesOverlap(s1,e1,s2,e2){ return s1<e2 && s2<e1; }
function hasOverlappingFreeTime(meId, buddyId){
  const mine = userAvailableSlots(meId), theirs = userAvailableSlots(buddyId);
  return mine.some(a=> theirs.some(b=> a.date===b.date && timeRangesOverlap(a.startTime,a.endTime,b.startTime,b.endTime)));
}
function buddyMatchesAvailability(buddyId){
  const sel = UI.buddyFilters.availability;
  if(!sel || !sel.length) return true;
  if(sel.includes('overlap') && hasOverlappingFreeTime(P.currentUserId, buddyId)) return true;
  const buckets = buddyTimeSlots(buddyId);
  return sel.some(s=> s!=='overlap' && buckets.has(s));
}
function buddyHasSkillAtLevel(u, skill, level){
  const entries = [...(u.teach||[]), ...(u.learn||[])];
  return entries.some(e=> (!skill || e.skill.toLowerCase()===skill.toLowerCase()) && (!level || e.level===level));
}
function applyBuddyFilters(list){
  const f = UI.buddyFilters;
  if(!hasActiveBuddyFilters()) return list;
  return list.filter(m=>{
    const b = m.user;
    if((f.skill || f.level) && !buddyHasSkillAtLevel(b, f.skill, f.level)) return false;
    if(f.pref==='teach' && !(m.theyTeachMe && m.theyTeachMe.length)) return false;
    if(f.pref==='learn' && !(m.iTeachThem && m.iTeachThem.length)) return false;
    if(f.pref==='mutual' && !m.twoWay) return false;
    if(!buddyMatchesAvailability(b.id)) return false;
    /* Explicit override: show buddies with this interest regardless of
       whether it's shared with the current user's own profile. */
    if(f.interest && !userHasInterest(b, f.interest)) return false;
    return true;
  });
}

    chips.push(`<div class="active-filter-chip">Time: ${label} <span class="x" onclick="bfRemoveAvailability('${key}')">×</span></div>`);
  });
  if(f.pref) chips.push(`<div class="active-filter-chip">Buddy: ${(PREF_OPTIONS.find(p=>p.key===f.pref)||{}).label} <span class="x" onclick="bfRemovePref()">×</span></div>`);
  if(f.interest) chips.push(`<div class="active-filter-chip">Interest: ${interestIconFor(f.interest)} ${f.interest} <span class="x" onclick="bfRemoveInterest()">×</span></div>`);
  if(!chips.length) return '';
  return `<div class="active-filters-row">${chips.join('')}<span class="clear-all-link" onclick="bfClearAll()">Clear All</span></div>`;
}

/* ---------- Onboarding helpers ---------- */
function toggleDraftSkill(kind, skillName){
  const list = kind==='teach' ? UI.onboard.draftTeach : UI.onboard.draftLearn;
  const idx = list.findIndex(s=>s.skill===skillName);
  if(idx>=0) list.splice(idx,1);
  else list.push({skill:skillName, level: kind==='teach'?'Beginner':'Beginner', goal: kind==='learn'?'Intermediate':null});
  render();
}
function setDraftLevel(kind, skillName, level){
  const list = kind==='teach' ? UI.onboard.draftTeach : UI.onboard.draftLearn;
  const item = list.find(s=>s.skill===skillName);
  if(item) item.level = level;
  render();
}
function setDraftGoal(skillName, level){
  const item = UI.onboard.draftLearn.find(s=>s.skill===skillName);
  if(item) item.goal = level;
  render();
}
function addCustomSkill(kind){
  const val = esc(UI.onboard.customInput.trim()).slice(0,60);
  if(!val) return;
  if(!SKILLS_MASTER.find(s=>s.name.toLowerCase()===val.toLowerCase())){
    SKILLS_MASTER.push({name: val, icon:'🧩'});
  }
  toggleDraftSkill(kind, val);
  UI.onboard.customInput='';
}
function onboardNextStep(){
  const seq = [];
  if(UI.onboard.purpose==='teach' || UI.onboard.purpose==='both') seq.push('teachSelect','teachLevels');
  if(UI.onboard.purpose==='learn' || UI.onboard.purpose==='both') seq.push('learnSelect','learnLevels');
  const idx = seq.indexOf(UI.onboard.step);
  if(UI.onboard.step==='teachSelect' && UI.onboard.draftTeach.length===0){ toast('Choose at least one skill you can teach.'); return; }
  if(UI.onboard.step==='learnSelect' && UI.onboard.draftLearn.length===0){ toast('Choose at least one skill you want to learn.'); return; }
  if(idx < seq.length-1){ UI.onboard.step = seq[idx+1]; render(); window.scrollTo(0,0); }
  else finishOnboarding();
}
function onboardPrevStep(){
  const seq = [];
  if(UI.onboard.purpose==='teach' || UI.onboard.purpose==='both') seq.push('teachSelect','teachLevels');
  if(UI.onboard.purpose==='learn' || UI.onboard.purpose==='both') seq.push('learnSelect','learnLevels');
  const idx = seq.indexOf(UI.onboard.step);
  if(idx>0){ UI.onboard.step = seq[idx-1]; render(); }
  else go('purpose');
}
function finishOnboarding(){
  const u = me();
  u.teach = UI.onboard.draftTeach.map(t=>({skill:t.skill, level:t.level, verified:false}));
  u.learn = UI.onboard.draftLearn.map(t=>({skill:t.skill, level:t.level, goal:t.goal}));
  save();
  if(u.teach.length || u.learn.length) recordSkillActivity(u.id);
  // seed one incoming request from best-matching seed user, for demo richness
  const matches = rankedMatches();
  if(matches.length){
    const best = matches[0];
    const already = P.requests.find(r=> r.fromId===best.user.id && r.toId===u.id);
    if(!already){
      P.requests.push({
        id:'req-'+Date.now(), fromId:best.user.id, toId:u.id, status:'pending',
        message:`Hi! I can teach you ${best.theyTeachMe[0]?.skill || best.user.teach[0].skill}, and I'd love to learn from you too.`,
        teachSkillTheirs: (best.theyTeachMe[0]||best.user.teach[0]).skill,
        teachSkillMine: (best.iTeachThem[0]||{}).skill || null,
        ts: Date.now()
      });
      save();
    }
  }
  go('profile');
}

/* ---------- Requests / connections ---------- */

  const theirSkill = req.teachSkillTheirs || (buddy.teach[0]?.skill) || null;
  if(!conns.find(c=>c.buddyId===buddy.id)){
    conns.push({
      id:'conn-'+Date.now(), buddyId:buddy.id,
      mySkill, theirSkill,
      progressTeaching: 20, progressLearning: 20,
      sessionsTeaching:1, sessionsLearning:1
    });

  save();
  toast('🎉 Skill Sync Connected!');

/* =========================================================
   KARMA POINTS SERVICE
   ---------------------------------------------------------
   Centralized module for the Skill Sync learning economy.
   1 Karma Point = 1 hour of learning/teaching time.
   New users start with 2 Karma Points (see doSignup/doGoogleDemo
   and the migration step near loadPersisted()).

   Everything here reads/writes through P (the same localStorage-
   backed store used by the rest of the app) so there is a single
   source of truth: P.users[id].karma_points and P.karmaTransactions.

   This module is written so it can be swapped for real API calls
   later — every function takes/returns plain data, never touches
   the DOM, and the transaction shape mirrors the KARMA_TRANSACTIONS
   table described for the future backend (see section 22 of spec).
   ========================================================= */
const KARMA_STARTING_BALANCE = 2;
const KARMA_PER_HOUR = 1;
const KARMA_BADGE_LEVELS = [
  {min:50, emoji:'🏆', label:'Community Champion'},
  {min:25, emoji:'💎', label:'Skill Mentor'},
  {min:10, emoji:'🔥', label:'Skill Sharer'},
  {min:5,  emoji:'⭐', label:'Contributor'},
  {min:0,  emoji:'🌱', label:'Beginner'}
];

function getKarmaPoints(userId){
  const u = P.users[userId];
  return u ? (u.karma_points||0) : 0;
}
function karmaBadge(points){
  return KARMA_BADGE_LEVELS.find(l=> points >= l.min) || KARMA_BADGE_LEVELS[KARMA_BADGE_LEVELS.length-1];
}
function hasSufficientKarma(userId, amount){
  return getKarmaPoints(userId) >= amount;
}
/* Internal: create a Karma transaction record. Never call directly from UI —
   go through completeSessionKarma() so balances and history always agree. */
function recordKarmaTransaction({userId, type, amount, sessionId, otherUserId, description}){
  const tx = {
    id:'karma_tx_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    userId, type, amount, sessionId, otherUserId, description,
    timestamp: Date.now()
  };
  P.karmaTransactions.push(tx);
  return tx;
}
/* Internal: adjust a single user's balance. Karma can never go negative. */
function addKarma(userId, amount){
  const u = P.users[userId];
  if(!u) return 0;
  u.karma_points = (u.karma_points||0) + amount;
  return u.karma_points;
}
function subtractKarma(userId, amount){
  const u = P.users[userId];
  if(!u) return 0;
  u.karma_points = Math.max(0, (u.karma_points||0) - amount);
  return u.karma_points;
}
function getKarmaHistory(userId, limit){
  const list = P.karmaTransactions.filter(tx=> tx.userId===userId).sort((a,b)=> b.timestamp - a.timestamp);
  return limit ? list.slice(0,limit) : list;
}
function getKarmaStats(userId){
  const hist = getKarmaHistory(userId);
  const totalEarned = hist.filter(t=>t.type==='earned').reduce((s,t)=>s+t.amount,0);
  const totalSpent = hist.filter(t=>t.type==='spent').reduce((s,t)=>s+t.amount,0);
  return {
    balance: getKarmaPoints(userId),
    totalEarned, totalSpent,
    hoursTaught: totalEarned,   // 1 Karma = 1 hour, so earned hours === hours taught
    hoursLearned: totalSpent    // spent hours === hours learned
  };
}
/* The one and only place Karma is transferred between two users for a
   completed session. This is the "atomic transaction" described in the
   spec: it is guarded against duplicates, blocked when the learner can't
   afford it, and produces matching history entries for both sides. */
function completeSessionKarma({learnerId, teacherId, sessionId, duration=1, learnerDescription, teacherDescription}){
  // Duplicate-transaction guard: a given sessionId may only ever be processed once.
  if(P.karmaTransactions.some(tx=> tx.sessionId===sessionId)){
    return {ok:false, reason:'duplicate'};
  }
  if(!hasSufficientKarma(learnerId, duration)){
    return {ok:false, reason:'insufficient'};
  }
  // BEGIN "transaction" (simulated atomically within the in-memory store,
  // committed to localStorage in a single save() call at the end).
  subtractKarma(learnerId, duration);
  addKarma(teacherId, duration);
  recordKarmaTransaction({
    userId:learnerId, type:'spent', amount:duration, sessionId, otherUserId:teacherId,
    description: learnerDescription || 'Learned a skill'
  });
  recordKarmaTransaction({
    userId:teacherId, type:'earned', amount:duration, sessionId, otherUserId:learnerId,
    description: teacherDescription || 'Taught a skill'
  });
  save();
  // COMMIT
  return {ok:true};
}

  return `<span class="karma-pill ${size==='sm'?'sm':''}">🪙 ${getKarmaPoints(userId)} Karma</span>`;

/* ---------- Sessions ---------- */
function pathFor(progress){
  return PATH_TEMPLATE.map((title,i)=>{
    const threshold = (i)*25;
    const nextThreshold = (i+1)*25;
    let status='locked';
    if(progress >= nextThreshold) status='done';
    else if(progress >= threshold) status='current';
    return {title, status};
  });
}
/* =========================================================
   SKILL STREAK SERVICE
   ---------------------------------------------------------
   Tracks daily, calendar-date-based engagement (not page visits).
   Reads/writes through P.users[id].streakData, persisted via the
   same save()/localStorage mechanism as the rest of the app.

   The only entry point other code should call is
   recordSkillActivity(userId) — it is idempotent per calendar day,
   so it can safely be called from any real skill-development action
   (completing a session, updating skills, etc.) without ever
   double-counting a day or letting a page refresh bump the streak.
   ========================================================= */
const STREAK_MILESTONES = [
  {days:3,   label:'Getting Started',        karma:0},
  {days:7,   label:'One Week Strong',        karma:5},
  {days:14,  label:'Skill Builder',          karma:10},
  {days:30,  label:'Skill Sync Champion',    karma:20},
  {days:50,  label:'Consistent Learner',     karma:0},
  {days:100, label:'Skill Master',           karma:0},
];
function getStreakData(userId){
  const u = P.users[userId];
  if(!u) return { currentStreak:0, longestStreak:0, lastActivityDate:null, streakHistory:[], milestonesAwarded:[] };
  if(!u.streakData) u.streakData = { currentStreak:0, longestStreak:0, lastActivityDate:null, streakHistory:[], milestonesAwarded:[] };
  return u.streakData;
}
/* The one place a day's worth of Skill Streak credit is granted. Safe to
   call from any qualifying activity — a second (or third) call on the
   same calendar date is a no-op, so multiple activities in one day never
   increase the streak more than once, and refreshing the page (which
   calls nothing) can never increase it at all. */
function recordSkillActivity(userId){
  const u = P.users[userId];
  if(!u) return;
  const sd = getStreakData(userId);
  const today = todayISO();
  if(sd.lastActivityDate === today) return; // already counted today — no duplicate credit

  const yesterday = addDaysISO(today, -1);
  sd.currentStreak = (sd.lastActivityDate === yesterday) ? sd.currentStreak + 1 : 1;
  sd.lastActivityDate = today;
  if(!sd.streakHistory.includes(today)) sd.streakHistory.push(today);
  if(sd.streakHistory.length > 60) sd.streakHistory = sd.streakHistory.slice(-60); // bounded history

  if(sd.currentStreak > sd.longestStreak) sd.longestStreak = sd.currentStreak;

  // Award any newly-reached milestone(s) exactly once, ever.
  let newMilestone = null;
  STREAK_MILESTONES.forEach(m=>{
    if(sd.currentStreak >= m.days && !sd.milestonesAwarded.includes(m.days)){
      sd.milestonesAwarded.push(m.days);
      if(m.karma > 0){
        addKarma(userId, m.karma);
        recordKarmaTransaction({
          userId, type:'earned', amount:m.karma,
          sessionId:`streak_milestone_${userId}_${m.days}`, otherUserId:null,
          description:`${m.days}-day Skill Streak milestone`
        });
      }
      newMilestone = m; // keep the highest one reached this call
    }
  });
  save();
  showStreakFeedback(sd, newMilestone);
}
function showStreakFeedback(sd, milestone){
  if(milestone){
    toast(`🎉 ${milestone.days} Day Streak! ${milestone.label}${milestone.karma>0?` — +${milestone.karma} Karma`:''}`);
  } else if(sd.currentStreak === 1){
    toast('🔥 Your Skill Streak has started! Come back tomorrow to make it 2 days.');
  } else {
    toast(`🔥 ${sd.currentStreak} Day Streak! Keep learning tomorrow to continue.`);
  }
}
/* Mon–Sun view of the current calendar week for the weekly tracker. */
function streakWeekDays(sd){
  const now = new Date();
  const dow = (now.getDay()+6)%7; // 0=Mon..6=Sun
  const monday = new Date(now); monday.setDate(now.getDate()-dow);
  const labels = ['M','T','W','T','F','S','S'];
  const todayStr = todayISO();
  return labels.map((lbl,i)=>{
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const iso = fmtDateISO(d);
    return { label:lbl, done: sd.streakHistory.includes(iso), isToday: iso===todayStr };
  });
}
function streakCardHTML(u){
  const sd = getStreakData(u.id);
  const week = streakWeekDays(sd);
  const nextMilestone = STREAK_MILESTONES.find(m=> sd.currentStreak < m.days);
  return `
  <div class="card streak-card" style="margin-bottom:22px;">
    <div style="display:flex; flex-wrap:wrap; gap:26px; align-items:center; justify-content:space-between;">
      <div style="display:flex; gap:22px; align-items:center;">
        <div style="text-align:center;">

          <div class="streak-num">${sd.currentStreak}</div>
          <div class="karma-label" style="margin-bottom:0;">Day Streak</div>
        </div>
        <div style="text-align:center;">
          <div class="streak-flame">🏆</div>
          <div class="streak-num-mono">${sd.longestStreak}</div>
          <div class="karma-label" style="margin-bottom:0;">Best Streak</div>
        </div>
      </div>
      <div class="streak-week">
        ${week.map(d=>`<div class="streak-day ${d.done?'done':''} ${d.isToday?'today':''}"><div>${d.label}</div><div class="dot">${d.done?'✓':'○'}</div></div>`).join('')}
      </div>
    </div>
    <div style="margin-top:14px; font-size:12.5px; color:var(--text-dim);">
      ${nextMilestone ? `Next milestone: 🔥 ${nextMilestone.days} days — ${nextMilestone.label} (${nextMilestone.days - sd.currentStreak} to go)` : '🏅 All streak milestones unlocked!'}
    </div>
    <div class="streak-milestones">
      ${STREAK_MILESTONES.map(m=>`<div class="chip static ${sd.milestonesAwarded.includes(m.days)?'selected':''}" style="font-size:11.5px; padding:5px 10px;">🔥 ${m.days}d · ${m.label}</div>`).join('')}
    </div>
  </div>`;
}
function completeSession(connId, kind){
  const u = me();
  const conn = u.connections.find(c=>c.id===connId);
  if(!conn) return;
  const buddy = P.users[conn.buddyId];

  // Figure out who is learning and who is teaching this particular 1-hour
  // session, so Karma flows the right direction regardless of which side
  // of the connection card the user clicked.
  const learnerId = kind==='learning' ? u.id : conn.buddyId;
  const teacherId = kind==='learning' ? conn.buddyId : u.id;
  const skillName = kind==='learning' ? conn.theirSkill : conn.mySkill;

  // Each "Mark Completed" click is one distinct 1-hour session. Number them
  // per connection+kind so re-renders/refreshes can never double-charge Karma.
  const sessionNumber = (kind==='learning' ? (conn.sessionsLearning||0) : (conn.sessionsTeaching||0)) + 1;
  const sessionId = `karma_session_${connId}_${kind}_${sessionNumber}`;

  if(!hasSufficientKarma(learnerId, KARMA_PER_HOUR)){
    if(kind==='learning'){
      openKarmaInsufficientModal(buddy);
    } else {
      toast(`${buddy?.name||'Your buddy'} doesn't have enough Karma to complete this session yet.`);
    }
    return;
  }

  const result = completeSessionKarma({
    learnerId, teacherId, sessionId, duration: KARMA_PER_HOUR,
    learnerDescription: `Learned ${skillName||'a skill'} from ${P.users[teacherId]?.name||'a buddy'}`,
    teacherDescription: `Taught ${skillName||'a skill'} to ${P.users[learnerId]?.name||'a buddy'}`
  });
  if(!result.ok){
    // Already processed (e.g. stale UI state) — do nothing rather than risk double-charging.
    if(result.reason==='duplicate') return;
    if(result.reason==='insufficient'){ openKarmaInsufficientModal(buddy); return; }
  }

  if(kind==='learning'){
    conn.progressLearning = Math.min(100, conn.progressLearning+20);
    conn.sessionsLearning = sessionNumber;
  } else {
    conn.progressTeaching = Math.min(100, conn.progressTeaching+20);
    conn.sessionsTeaching = sessionNumber;
  }
  u.sessionsCompleted = (u.sessionsCompleted||0)+1;
  u.streak = (u.streak||0)+1;
  save();
  recordSkillActivity(u.id);
  UI.karmaBump = Date.now();
  openKarmaCompletionModal(kind, buddy, skillName);
  render();
}

      <p style="color:var(--text-dim); font-size:13.5px; margin-bottom:18px;">You need ${KARMA_PER_HOUR} Karma Point to book this 1-hour learning session.</p>

  const email = document.getElementById('su-email')?.value.trim();
  const pass = document.getElementById('su-pass')?.value.trim();
  UI.authErrors = {};
  if(!name) UI.authErrors.name='Please enter your name.';
  if(!email) UI.authErrors.email='Please enter your email.';
  if(!pass) UI.authErrors.pass='Please enter a password.';
  if(Object.keys(UI.authErrors).length){ render(); return; }
  const id = 'me-'+Date.now();
  const safeName = esc(name);
  P.users[id] = {
    id, name: safeName, email, username: generateUsernameFromName(safeName, id), bio:'', location:'',
    teach:[], learn:[], connections:[], sessionsCompleted:0, streak:0,
    streakData:{ currentStreak:0, longestStreak:0, lastActivityDate:null, streakHistory:[], milestonesAwarded:[] },
    ratingAvg:'—', ratingCount:0, karma_points: KARMA_STARTING_BALANCE, interests:[]
  };
  P.currentUserId = id;
  save();
  toast(`Welcome to Skill Sync! 🎉 You've received ${KARMA_STARTING_BALANCE} Karma Points to start learning.`);
  go('purpose');
}
function doLogin(){
  const email = document.getElementById('li-email')?.value.trim();
  const pass = document.getElementById('li-pass')?.value.trim();
  UI.authErrors = {};
  if(!email) UI.authErrors.email='Please enter your email.';
  if(!pass) UI.authErrors.pass='Please enter your password.';
  if(Object.keys(UI.authErrors).length){ render(); return; }
  const existing = Object.values(P.users).find(u=> u.email===email);
  if(!existing){ UI.authErrors.email='No account found — please create one.'; render(); return; }
  P.currentUserId = existing.id;
  save();
  go(existing.teach && (existing.teach.length||existing.learn.length) ? 'dashboard' : 'purpose');
}

/* =========================================================
   RENDER FUNCTIONS
   ========================================================= */
/* ---------- Landing Carousel state ----------
   Isolated to the public landing page only. render() fully replaces
   #app.innerHTML on every call (this app doesn't use a virtual DOM), so
   this state — and its single autoplay timer / global listeners — lives
   OUTSIDE the render cycle and is guarded so it's attached exactly once
   per "landing session" and always torn down on the way to any other view,
   regardless of how UI.view got changed (go(), logout(), deleteAccount(),
   boot()). See the mount/cleanup guard at the top of render(). */
const LANDING_SLIDE_COUNT = 7;
let LANDING = { slide:0, dir:'next', autoplayTimer:null, lastWheel:0, touchStartX:null, touchStartY:null, active:false, pausedByFocus:false };

function landingGoTo(index, opts={}){
  const n = LANDING_SLIDE_COUNT;
  index = ((index % n) + n) % n;
  if(index === LANDING.slide) return;
  LANDING.dir = opts.dir || (index > LANDING.slide ? 'next' : 'prev');
  LANDING.slide = index;
  if(!opts.fromAutoplay) landingResetAutoplay();
  render();
}
function landingNext(opts={}){ landingGoTo(LANDING.slide+1, {dir:'next', ...opts}); }
function landingPrev(opts={}){ landingGoTo(LANDING.slide-1, {dir:'prev', ...opts}); }

function landingAutoplayTick(){
  if(UI.view !== 'landing'){ landingStopAutoplay(); return; }
  if(UI.themeMenuOpen || LANDING.pausedByFocus) return; // paused while an overlay/control is engaged
  landingNext({fromAutoplay:true});
}
function landingStartAutoplay(){
  landingStopAutoplay();
  LANDING.autoplayTimer = setInterval(landingAutoplayTick, 6000);
}
function landingStopAutoplay(){
  if(LANDING.autoplayTimer){ clearInterval(LANDING.autoplayTimer); LANDING.autoplayTimer = null; }
}
function landingResetAutoplay(){ if(UI.view === 'landing') landingStartAutoplay(); }
function landingPauseAutoplay(){ LANDING.pausedByFocus = true; }
function landingResumeAutoplay(){ LANDING.pausedByFocus = false; }

function landingHandleKeydown(e){
  if(UI.view !== 'landing') return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA') return;
  if(e.key === 'ArrowRight'){ e.preventDefault(); landingNext(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); landingPrev(); }
  else if(e.key === ' ' || e.code === 'Space'){ e.preventDefault(); landingNext(); }
  else if(e.key === 'Escape'){ if(UI.themeMenuOpen){ UI.themeMenuOpen=false; render(); } }
}
function landingHandleWheel(e){
  if(UI.view !== 'landing') return;
  const now = Date.now();
  const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if(Math.abs(delta) < 12) return;
  e.preventDefault();
  if(now - LANDING.lastWheel < 700) return; // debounce: one gesture = one slide
  LANDING.lastWheel = now;
  if(delta > 0) landingNext(); else landingPrev();
}
function landingTouchStart(e){
  if(UI.view !== 'landing' || !e.touches || !e.touches[0]) return;
  LANDING.touchStartX = e.touches[0].clientX; LANDING.touchStartY = e.touches[0].clientY;
}
function landingTouchEnd(e){
  if(UI.view !== 'landing' || LANDING.touchStartX===null || !e.changedTouches || !e.changedTouches[0]) return;
  const dx = e.changedTouches[0].clientX - LANDING.touchStartX;
  const dy = e.changedTouches[0].clientY - LANDING.touchStartY;
  LANDING.touchStartX = null;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
    if(dx < 0) landingNext(); else landingPrev();
  }
}
function landingHandleResize(){ /* no-op: layout is pure CSS/flex, nothing to recompute in JS */ }

function landingInit(){
  if(LANDING.active) return;
  LANDING.active = true; LANDING.slide = 0; LANDING.dir = 'next'; LANDING.pausedByFocus = false;
  document.addEventListener('keydown', landingHandleKeydown);
  window.addEventListener('wheel', landingHandleWheel, {passive:false});
  window.addEventListener('touchstart', landingTouchStart, {passive:true});
  window.addEventListener('touchend', landingTouchEnd, {passive:true});
  window.addEventListener('resize', landingHandleResize);
  document.documentElement.classList.add('no-scroll');
  landingStartAutoplay();
}
function landingCleanup(){
  if(!LANDING.active) return;
  LANDING.active = false;
  document.removeEventListener('keydown', landingHandleKeydown);
  window.removeEventListener('wheel', landingHandleWheel);
  window.removeEventListener('touchstart', landingTouchStart);
  window.removeEventListener('touchend', landingTouchEnd);
  window.removeEventListener('resize', landingHandleResize);
  document.documentElement.classList.remove('no-scroll');
  landingStopAutoplay();
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  // Landing-carousel mount/cleanup: single source of truth, regardless of
  // how UI.view was changed. Guarded so init/cleanup each run at most once
  // per transition — no duplicate listeners, no competing timers.
  if(UI.view === 'landing' && !LANDING.active) landingInit();
  else if(UI.view !== 'landing' && LANDING.active) landingCleanup();
  switch(UI.view){
    case 'landing': html = viewLanding(); break;
    case 'auth': html = viewAuth(); break;
    case 'purpose': html = viewPurpose(); break;
    case 'skills': html = viewSkills(); break;
    case 'profile': html = shell(viewProfile()); break;
    case 'dashboard': html = shell(viewDashboard()); break;
    case 'findbuddy': html = shell(viewFindBuddy()); break;
    case 'buddyprofile': html = shell(viewBuddyProfile()); break;
    case 'requests': html = shell(viewRequests()); break;
    case 'community': html = shell(viewCommunity()); break;
    case 'sessions': html = shell(viewSessions()); break;
    case 'interactive': html = shell(viewInteractive()); break;
    case 'interactiveDetail': html = shell(viewInteractiveDetail()); break;
    case 'interactiveTeach': html = shell(viewInteractiveTeach()); break;
    case 'interactiveMy': html = shell(viewInteractiveMy()); break;
    case 'calendar': html = shell(viewCalendarPage()); break;
    case 'karmahistory': html = shell(viewKarmaHistory()); break;
    case 'feedback': html = shell(viewFeedback()); break;
    case 'settings': html = shell(viewSettings()); break;
    case 'verifyHome': html = shell(viewVerifyHome()); break;
    case 'verifyNew': html = shell(viewVerifyNew()); break;
    case 'verifyDetail': html = shell(viewVerifyDetail()); break;
    case 'adminVerifications': html = shell(viewAdminVerifications()); break;
    case 'thankyou': html = viewThankYou(); break;
    case 'creators': html = viewCreators(); break;
    default: html = viewLanding();
  }
  app.innerHTML = html;
}

/* ---------- Landing ----------
   The landing page is the ONLY view rendered as a full-screen carousel.
   Only the currently-active slide is ever mounted (see LANDING.slide) —
   the other six aren't in the DOM, which keeps this cheap on every
   autoplay/render tick and sidesteps needing 7 stacked absolutely-
   positioned panels. Entrance uses a keyframe animation on mount (same
   idiom as .fade-up / modal .popIn elsewhere in this app), since this
   app re-renders by replacing innerHTML rather than diffing a virtual
   DOM, so a from->to CSS transition has no "from" state to animate. */
const LANDING_SLIDE_TITLES = ['SkillSync','The Process','Why SkillSync?','Exchange','Find a Match','Reputation','Get Started'];

function viewLanding(){
  const i = LANDING.slide;
  const animClass = LANDING.dir==='prev' ? 'ls-anim-prev' : 'ls-anim-next';
  const n = LANDING_SLIDE_TITLES.length;
  return `
  <div class="landing-page">
  <nav class="topnav">
    <div class="topnav-inner">
      <div class="brand-mark" role="img" aria-label="SkillSync"><img src="${SKILLSYNC_LOGO}" alt="SkillSync" loading="lazy"></div>
      <div class="nav-links">
        <a class="nav-link" onclick="landingGoTo(1)">How it works</a>
        <a class="nav-link" onclick="landingGoTo(2)">Why Skill Sync</a>
      </div>
      <div class="nav-right">
        <div class="creators-toggle-wrap">
          <div class="theme-toggle" onclick="go('creators')" tabindex="0" aria-label="Meet the creators">✍️</div>
          <span class="ct-label">Meet the creators</span>
        </div>
        <div class="usermenu-wrap">
          <div class="theme-toggle" onclick="event.stopPropagation(); UI.themeMenuOpen=!UI.themeMenuOpen; render();" title="Change theme">🎨</div>
          ${themePickerHTML()}
        </div>
        <button class="btn btn-ghost btn-sm" onclick="UI.authMode='login'; go('auth')">Log in</button>
        <button class="btn btn-primary btn-sm" onclick="UI.authMode='signup'; go('auth')">Sign up</button>
      </div>
    </div>
  </nav>

  <section class="landing-carousel" role="region" aria-roledescription="carousel" aria-label="Skill Sync introduction"
    onmouseenter="landingPauseAutoplay()" onmouseleave="landingResumeAutoplay()"
    onfocusin="landingPauseAutoplay()" onfocusout="landingResumeAutoplay()">
    <div class="ls-viewport">
      <div class="lc-bg" aria-hidden="true"><div class="lc-blob b1"></div><div class="lc-blob b2"></div><div class="lc-blob b3"></div></div>
      <button class="lc-arrow lc-prev" onclick="landingPrev()" ${i===0?'disabled':''} aria-label="Previous slide">‹</button>
      <div class="ls-slide ${animClass}" key="${i}" role="group" aria-roledescription="slide" aria-label="Slide ${i+1} of ${n}: ${LANDING_SLIDE_TITLES[i]}">
        ${landingSlideContent(i)}
      </div>
      <button class="lc-arrow lc-next" onclick="landingNext()" ${i===n-1?'disabled':''} aria-label="Next slide">›</button>
    </div>
    <div class="lc-footer">
      <div class="lc-dots" role="tablist" aria-label="Slides">
        ${LANDING_SLIDE_TITLES.map((title,idx)=>`<button class="lc-dot ${idx===i?'active':''}" role="tab" aria-selected="${idx===i}" aria-label="Go to slide ${idx+1}: ${title}" onclick="landingGoTo(${idx})"></button>`).join('')}
      </div>
      <div class="lc-meta">
        <span>${String(i+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}</span>
        <span class="lc-progress-track"><span class="lc-progress-fill" style="width:${((i+1)/n*100).toFixed(0)}%"></span></span>
      </div>
    </div>
  </section>
  </div>
  `;
}

function landingSlideContent(i){
  switch(i){
    case 0: return landingSlideHero();
    case 1: return landingSlideProcess();
    case 2: return landingSlideWhy();
    case 3: return landingSlideExchange();
    case 4: return landingSlideMatch();
    case 5: return landingSlideReputation();
    case 6: return landingSlideFinal();
    default: return '';
  }
}

function conns_label(c, which){
  const buddy = P.users[c.buddyId];
  if(which==='learn') return `${iconFor(c.theirSkill||'')} ${c.theirSkill||'—'} <span style="color:var(--text-faint); font-weight:400;">with ${buddy?.name||'buddy'}</span>`;

function statCard(num,label){ return `<div class="card stat-card"><div class="num">${num}</div><div class="lbl">${label}</div></div>`; }
function progressRow(labelHtml, pct){
  return `<div style="margin-bottom:14px;">
    <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;"><span>${labelHtml}</span><span class="mono" style="color:var(--text-dim);">${pct}%</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>`;
}
function computeBadges(u){
  const b=[];
  if((u.connections||[]).length>=1) b.push('🌱 First Sync');
  if((u.sessionsCompleted||0)>=5) b.push('🔥 Active Learner');
  if((u.connections||[]).length>=10) b.push('🤝 Helpful Buddy');
  if(u.teach.some(t=>t.verified) || (u.connections||[]).some(c=>c.sessionsTeaching>=3)) b.push('🎓 Skill Sharer');
  if(u.learn.length>=3) b.push('🚀 Skill Explorer');
  const prog = (P.interactiveProgress[u.id]||{});
  if(Object.entries(prog).some(([cid,pr])=>{ const c=courseById(cid); return c && courseProgressPctForCourse(pr,c)>=100; })) b.push('🏆 Interactive Session Completed');
  return b;
}

/* =========================================================
   INTERACTIVE LEARNING SESSION
   ---------------------------------------------------------
   Course: {id, title, description, category, difficulty,
            estMinutes, mentorId, mentorName, verified, learners,

            lessons:[{id, title, desc, videoTitle, videoUrl,

   Progress (per user, per course), stored in

   {completedTasks:{taskId:true}, timeSpentMin, startedAt}
   Mock-only: no backend, so videos/tasks/progress live in
   localStorage via the same save() used by the rest of the app.
   ========================================================= */

function courseById(id){ return P.interactiveCourses.find(c=>c.id===id); }
function allTasks(course){ return course.lessons.flatMap(l=>l.tasks); }
function getInteractiveProgress(userId, courseId){
  if(!P.interactiveProgress[userId]) P.interactiveProgress[userId] = {};
  if(!P.interactiveProgress[userId][courseId]) P.interactiveProgress[userId][courseId] = {completedTasks:{}, timeSpentMin:0, startedAt:Date.now()};
  return P.interactiveProgress[userId][courseId];
}
function myCourseProgressPct(courseId){
  const course = courseById(courseId); if(!course) return 0;
  const pr = (P.interactiveProgress[P.currentUserId]||{})[courseId];
  if(!pr) return 0;
  return courseProgressPctForCourse(pr, course);
}
function courseProgressPctForCourse(progress, course){
  const total = allTasks(course).length || 1;
  const done = Object.keys(progress.completedTasks||{}).length;
  return Math.round((done/total)*100);
}
function toggleInteractiveTask(courseId, taskId){
  const course = courseById(courseId); if(!course) return;
  const pr = getInteractiveProgress(P.currentUserId, courseId);
  const wasDone = !!pr.completedTasks[taskId];
  if(wasDone){ delete pr.completedTasks[taskId]; }
  else{
    pr.completedTasks[taskId] = true;
    pr.timeSpentMin = (pr.timeSpentMin||0) + 5;
    recordSkillActivity(P.currentUserId);
    save();
    showInteractiveToast('Great job! You completed this task 🎉');
    render();
    return;
  }
  save(); render();
}

function showInteractiveToast(msg){

}

  }

  return `

    <div class="page-head">
      <span class="eyebrow" style="cursor:pointer;" onclick="go('interactive')">← All Sessions</span>
      <h1>${course.title}</h1>

          ${progressRingSVG(pct)}
          <div class="il-ring-label"><div class="pct">${pct}%</div><div class="sub">complete</div></div>
        </div>
      </div>
      <div class="card">
        <div class="section-title-sm">Your Skill Progress</div>
        <div class="stat-grid" style="grid-template-columns:1fr 1fr; margin-bottom:10px;">
          ${statCard(`${lessonsDone}/${course.lessons.length}`,'Lessons Completed')}
          ${statCard(`${doneTasks}/${totalTasks}`,'Tasks Completed')}

          ${statCard(`${pr.timeSpentMin||0}m`,'Time Spent')}
        </div>
        <div class="il-streak-pill">🔥 Learning streak: ${streak} day${streak===1?'':'s'}</div>
      </div>
    </div>

    <div class="section-title-sm">Your Learning Journey</div>
    <div class="card il-journey" style="margin-bottom:22px;">
      ${course.lessons.map((l,i)=>{
        const done = l.tasks.every(t=>pr.completedTasks[t.id]);
        return `<div class="il-journey-step ${done?'done':''}"><div class="il-journey-dot">${done?'✓':i+1}</div><div>${l.title}</div></div>`;
      }).join('')}
    </div>

    ${course.lessons.map(l=>lessonBlockHTML(course, l, pr)).join('')}
  </div>`;
}
function progressRingSVG(pct){
  const r=50, c=2*Math.PI*r;
  const off = c - (pct/100)*c;
  return `<svg class="il-ring" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--border-soft)" stroke-width="10"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="url(#ilgrad)" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset .6s;"/>
    <defs><linearGradient id="ilgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--violet)"/><stop offset="100%" stop-color="var(--cyan)"/>
    </linearGradient></defs>
  </svg>`;
}
function lessonBlockHTML(course, lesson, pr){
  const watchTask = lesson.tasks.find(t=>t.type==='watch');
  const watched = watchTask && pr.completedTasks[watchTask.id];
  return `
  <div class="card" style="margin-bottom:18px;">
    <div class="section-title-sm">🎥 ${lesson.title}</div>
    <div class="il-video">
      ${lesson.videoUrl ? `<video controls src="${lesson.videoUrl}"></video>` : `
        <div class="il-video-play" onclick="${watchTask?`markVideoWatched('${course.id}','${watchTask.id}')`:''}">▶</div>
        <div class="il-video-badge">${lesson.videoTitle}</div>
      `}
      ${watched?`<div class="il-video-watched">✓ Watched</div>`:''}
    </div>
    <div class="section-title-sm">Your Learning Tasks</div>
    ${lesson.tasks.map(t=>taskItemHTML(course, t, pr)).join('')}
  </div>`;
}
function taskItemHTML(course, t, pr){
  const done = !!pr.completedTasks[t.id];
  const typeLabel = t.type==='watch' ? 'Video' : t.type==='mcq' ? 'Multiple Choice' : 'Checklist';
  const clickable = t.type==='mcq' ? (done?'':`answerMcqTask('${course.id}', ${JSON.stringify(t).replace(/"/g,'&quot;')})`) : (t.type==='watch' ? `markVideoWatched('${course.id}','${t.id}')` : `toggleInteractiveTask('${course.id}','${t.id}')`);
  return `
  <div class="il-task ${done?'done':''}">
    <div class="il-task-check" onclick="${done && t.type!=='mcq' ? `toggleInteractiveTask('${course.id}','${t.id}')` : clickable}">✓</div>
    <div class="il-task-body">
      <div class="il-task-title">${t.label}</div>
      <div class="il-task-type">${typeLabel}${t.type==='mcq' && !done ? ' · tap to answer':''}</div>
    </div>
  </div>`;
}

function escAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }
function handleTeachVideoUpload(evt){
  const file = evt.target.files[0]; if(!file) return;
  UI.teachDraft.videoUrl = URL.createObjectURL(file);
  UI.teachDraft.videoLabel = file.name;
  render();
  toast('Video uploaded — preview ready');
}
function addTeachTask(){
  const d = UI.teachDraft;
  if(!d.newTaskLabel.trim()){ toast('Enter a task description first'); return; }
  if(d.newTaskType==='mcq'){
    const opts = d.mcqOptions.map(o=>o.trim()).filter(Boolean);
    if(opts.length<2){ toast('Add at least 2 answer options'); return; }
    d.tasks.push({id:'nt-'+Date.now(), type:'mcq', label:d.newTaskLabel.trim(), question:d.newTaskLabel.trim(), options:opts, correct:Math.min(d.mcqCorrect, opts.length-1)});
  } else {
    d.tasks.push({id:'nt-'+Date.now(), type:'checklist', label:d.newTaskLabel.trim()});
  }
  d.newTaskLabel=''; d.mcqOptions=['','']; d.mcqCorrect=0;
  render();
}
function removeTeachTask(i){ UI.teachDraft.tasks.splice(i,1); render(); }
function saveLessonDraft(){
  buildAndStoreSession('draft');
  toast('Lesson saved as draft');
  go('interactiveMy');
}
function publishInteractiveSession(){
  const d = UI.teachDraft;
  if(!d.title.trim() || !d.lessonTitle.trim() || !d.tasks.length){
    toast('Add a title, a lesson, and at least one task before publishing.');
    return;
  }
  buildAndStoreSession('published');
  toast('Session published 🎉');
  go('interactiveMy');
}
function buildAndStoreSession(status){
  const d = UI.teachDraft;
  const u = me();
  const watchTask = {id:'wt-'+Date.now(), type:'watch', label:'Watch the complete lesson'};
  const course = {
    id: 'course-'+Date.now(),
    title: esc(d.title.trim() || 'Untitled Session'),
    description: esc(d.description.trim()),
    category: d.category, difficulty: d.difficulty, estMinutes: d.estMinutes||60,
    mentorId: P.currentUserId, mentorName: u.name, verified: !!(u.teach||[]).some(t=>t.verified),
    learners: 0, status, createdAt: Date.now(),
    lessons: [{ id:'l1', title: esc(d.lessonTitle.trim()||'Lesson 1'), desc:esc(d.lessonDesc.trim()), objectives:esc(d.objectives.trim()),
      videoTitle: d.videoLabel||'Lesson Video', videoUrl: d.videoUrl||null, tasks: [watchTask, ...d.tasks] }]
  };
  P.interactiveCourses.push(course);
  save();
  UI.teachDraft = null;
}

/* ---------- Mentor dashboard ---------- */
function viewInteractiveMy(){
  const mine = P.interactiveCourses.filter(c=>c.mentorId===P.currentUserId);
  const published = mine.filter(c=>c.status==='published');
  const drafts = mine.filter(c=>c.status==='draft');
  const totalLearners = mine.reduce((s,c)=>s+c.learners,0);
  const avgCompletion = published.length ? Math.round(published.reduce((s,c)=>s+mockCompletionRate(c),0)/published.length) : 0;
  return `
  <div class="page wrap">
    <div class="page-head">
      <span class="eyebrow" style="cursor:pointer;" onclick="go('interactive')">← Interactive Sessions</span>
      <h1>My Sessions</h1>
      <p>Manage the interactive sessions you teach.</p>
    </div>

    <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);">
      ${statCard(published.length,'Published Sessions')}
      ${statCard(drafts.length,'Draft Sessions')}
      ${statCard(totalLearners,'Total Learners')}
      ${statCard(avgCompletion+'%','Avg. Completion')}
    </div>

    <div style="margin-bottom:18px;"><button class="btn btn-primary" onclick="UI.teachDraft=freshTeachDraft(); go('interactiveTeach');">+ Create New Session</button></div>

    ${mine.length ? mine.map(c=>`
      <div class="il-mentor-row">
        <div>
          <div style="font-weight:700; margin-bottom:4px;">${c.title} ${c.status==='draft'?'<span class="chip static" style="padding:2px 9px; font-size:10.5px;">Draft</span>':''}</div>
          <div style="font-size:12.5px; color:var(--text-dim);">👥 ${c.learners} learners &nbsp;·&nbsp; 📈 ${mockCompletionRate(c)}% completion</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost btn-sm" onclick="go('interactiveDetail',{id:'${c.id}'})">View Session</button>
        </div>
      </div>
    `).join('') : `
    <div class="card empty-state">
      <div class="ic">🎓</div>
      <h3>No sessions yet</h3>
      <p>Create your first interactive learning session to start teaching.</p>
    </div>`}
  </div>`;
}
function mockCompletionRate(c){
  // demo-only estimate since there is no backend of real learner records
  let h=0; for(const ch of c.id) h = (h*31 + ch.charCodeAt(0))>>>0;
  return 40 + (h % 55);
}

  return `<div class="mc-row" style="color:var(--violet, #a78bfa); margin-top:6px;">

function viewRequests(){
  const incoming = P.requests.filter(r=>r.toId===P.currentUserId).sort((a,b)=>b.ts-a.ts);

  return `

    ${outgoing.length===0 ? emptyMini("You haven't sent any requests yet.") : outgoing.map(r=>reqCard(r,'out')).join('')}

function reqCard(r, dir){
  const other = P.users[dir==='in' ? r.fromId : r.toId];
  const statusColor = r.status==='pending' ? 'var(--amber)' : r.status==='accepted' ? 'var(--success)' : 'var(--danger)';
  return `
  <div class="card" style="padding:18px; margin-bottom:10px;">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:10px;">
      ${avatarHTML(other,'sm')}

      <span class="karma-pill sm">🪙 ${getKarmaPoints(other.id)}</span>
      <span class="mono" style="margin-left:auto; font-size:11.5px; color:${statusColor}; text-transform:uppercase;">${r.status}</span>
    </div>
    <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:10px;">"${r.message}"</p>
    ${r.teachSkillMine || r.teachSkillTheirs ? `<p style="font-size:12.5px; color:var(--text-faint); margin-bottom:12px;">
      ${dir==='in' ? `You can teach ${other.name}: <b style="color:var(--text)">${r.teachSkillTheirs||'—'}</b> · They can teach you: <b style="color:var(--text)">${r.teachSkillMine||'—'}</b>` : ''}
    </p>`:''}
    ${dir==='in' && r.status==='pending' ? `
      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary btn-sm btn-block" onclick="acceptRequest('${r.id}')">Accept</button>
        <button class="btn btn-danger-o btn-sm btn-block" onclick="declineRequest('${r.id}')">Decline</button>
      </div>`:''}
  </div>`;
}

function statusMeta(status){
  return ({
    upcoming:{label:'Upcoming', cls:'upcoming', ic:'🔵'},
    available:{label:'Available', cls:'available', ic:'🟢'},
    pending:{label:'Pending', cls:'pending', ic:'🟡'},
    completed:{label:'Completed', cls:'completed', ic:'⚪'},
    cancelled:{label:'Cancelled', cls:'cancelled', ic:'🔴'},
  })[status] || {label:status, cls:'completed', ic:'•'};
}
/* 'me-demo' is a sentinel id used by the seeded mock data to represent
   "whichever real user is currently signed in" so the bundled demo data
   is populated immediately after signup, before any real sessions exist. */
function isMe(id){ return id===P.currentUserId || id==='me-demo'; }
function mySessions(){
  return P.sessions.filter(s=> isMe(s.teacher.id) || isMe(s.learner.id));
}
function otherParty(session){
  return isMe(session.teacher.id) ? session.learner : session.teacher;
}
function myAvailability(){ return P.availability.filter(a=> isMe(a.userId)); }

/* ----- Notifications (simulated; structured for a real push/email service) ----- */
function computeNotifications(userId){
  const notes = [];
  mySessions().filter(s=>s.status==='upcoming').forEach(s=>{
    const mins = minutesBetween(s.date, s.startTime);
    if(mins>0 && mins<=30) notes.push({ic:'🔔', title:`Upcoming session in ${mins} min`, body:`Your ${s.title} with ${otherParty(s).name} starts soon.`, ts:Date.now()-mins});
  });
  P.sessions.filter(s=> (s.teacher.id===userId||s.learner.id===userId) && s._notif).forEach(s=>{
    notes.push({ic: s._notif.ic, title:s._notif.title, body:s._notif.body, ts:s._notif.ts});
  });
  return notes.sort((a,b)=>b.ts-a.ts).slice(0,12);
}
function notifBellHTML(userId){
  const notes = computeNotifications(userId);
  return `
    <div class="notif-wrap">
      <div class="notif-bell" onclick="event.stopPropagation(); UI.notifOpen=!UI.notifOpen; render();" title="Notifications">🔔${notes.length?'<span class="dot"></span>':''}</div>
      <div class="notif-dropdown ${UI.notifOpen?'open':''}">
        ${notes.length===0 ? `<div class="notif-empty">You're all caught up 🎉</div>` :
          notes.map(n=>`<div class="notif-item"><div class="t1">${n.ic} ${n.title}</div><div class="t2">${n.body}</div></div>`).join('')}
      </div>
    </div>`;
}

function calNav(dir){
  const d = new Date(UI.calCursor+'T00:00:00');
  if(UI.calViewMode==='month') d.setMonth(d.getMonth()+dir);
  else if(UI.calViewMode==='week') d.setDate(d.getDate()+7*dir);
  else d.setDate(d.getDate()+dir);
  UI.calCursor = fmtDateISO(d); render();
}
function calGoToday(){ UI.calCursor = todayISO(); render(); }
function eventsForDate(iso){
  const evts = mySessions().filter(s=>s.date===iso).map(s=>({kind:'session', status:s.status, time:s.startTime, label:s.title.split(' ↔ ')[0]||s.title, id:s.id}));
  const slots = myAvailability().filter(a=>a.date===iso && a.status==='available').map(a=>({kind:'slot', status:'available', time:a.startTime, label:a.skill, id:a.id}));
  return [...evts, ...slots].sort((a,b)=> a.time.localeCompare(b.time));
}
function calEventChip(e){
  const meta = statusMeta(e.status);
  const onclick = e.kind==='session' ? `openSessionDetailModal('${e.id}')` : `openSlotDetailModal('${e.id}')`;
  return `<div class="cal-evt st-${meta.cls}" onclick="${onclick}" tabindex="0" role="button" aria-label="${meta.label} ${meta.label} at ${fmtTime12(e.time)}, status ${meta.label}">${meta.ic} ${fmtTime12(e.time)} ${e.label}</div>`;
}
function monthGridHTML(cursor){
  const year=cursor.getFullYear(), month=cursor.getMonth();
  const first = new Date(year,month,1);
  const startOffset = first.getDay();
  const gridStart = new Date(year,month,1-startOffset);
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells='';
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const iso = fmtDateISO(d);
    const inMonth = d.getMonth()===month;
    const isToday = iso===todayISO();
    const evts = eventsForDate(iso);
    cells += `<div class="cal-cell ${inMonth?'':'out'} ${isToday?'today':''}">
      <div class="cal-daynum">${d.getDate()}</div>
      ${evts.slice(0,3).map(calEventChip).join('')}
      ${evts.length>3?`<div class="cal-day-more">+${evts.length-3} more</div>`:''}
    </div>`;
  }
  return `<div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
}
function weekGridHTML(cursor){
  const start = new Date(cursor); start.setDate(cursor.getDate()-cursor.getDay());
  let cells='';
  const dows=[];
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const iso = fmtDateISO(d);
    dows.push(d.toLocaleDateString('en-US',{weekday:'short', day:'numeric'}));
    const evts = eventsForDate(iso);
    cells += `<div class="cal-cell ${iso===todayISO()?'today':''}" style="min-height:150px;">
      <div class="cal-daynum">${d.getDate()}</div>
      ${evts.map(calEventChip).join('')}
    </div>`;
  }
  return `<div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
}
function dayAgendaHTML(iso){
  const evts = eventsForDate(iso);
  return `
    <div style="font-weight:700; margin-bottom:12px;">${fmtDateLong(iso)}</div>
    ${evts.length===0 ? emptyCalendarState() :
      evts.map(e=>{
        const meta = statusMeta(e.status);
        const onclick = e.kind==='session' ? `openSessionDetailModal('${e.id}')` : `openSlotDetailModal('${e.id}')`;
        return `<div class="card" style="padding:12px 14px; margin-bottom:8px; cursor:pointer;" onclick="${onclick}">
          <div style="display:flex; align-items:center; justify-content:between; gap:10px;">
            <b>${fmtTime12(e.time)}</b> <span class="status-badge ${meta.cls}">${meta.ic} ${meta.label}</span>
          </div>
          <div style="margin-top:4px;">${e.label}</div>
        </div>`;
      }).join('')}`;
}

function createAvailabilitySlot(){
  const d = UI.availabilityDraft;
  if(!d.date || !d.startTime || !d.endTime){ toast('Please fill in date and time.'); return; }
  if(d.endTime<=d.startTime){ toast('End time must be after start time.'); return; }
  const dates = [d.date];
  if(d.repeat==='week') for(let i=1;i<=3;i++) dates.push(addDaysISO(d.date, 7*i));
  if(d.repeat==='weekday') for(let i=1;i<=7 && dates.length<5;i++){ const cand=addDaysISO(d.date,i); const dow=new Date(cand+'T00:00:00').getDay(); if(dow!==0&&dow!==6) dates.push(cand); }
  dates.forEach(dt=>{
    availabilityService.create({
      id:'slot_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
      userId:P.currentUserId, skill:d.skill, date:dt, startTime:d.startTime, endTime:d.endTime, duration:d.duration, status:'available'
    });
  });
  closeModal();
  toast(`✅ Availability added (${dates.length} slot${dates.length>1?'s':''})`);
  recordActivity_safe('PROFILE_UPDATED');
  render();
}
function removeAvailabilitySlot(id){
  P.availability = P.availability.filter(a=>a.id!==id);
  save(); closeModal(); toast('Slot removed.'); render();
}

      </div>

  } else {
    const slot = availabilityService.get(flow.slotId);
    if(!slot || slot.status!=='available'){
      openModal(`
        <h3>This slot is no longer available.</h3>
        <p style="color:var(--text-dim); font-size:13.5px; margin-bottom:16px;">Please select another time.</p>

    openModal(`
      <h3>Confirm Session</h3>
      <p style="color:var(--text-dim); font-size:13px; margin-bottom:2px;">Skill exchange</p>
      <p style="font-weight:700; margin-bottom:10px;">${mySkillTaught} ↔ ${flow.skill}</p>

/* =========================================================
   PROFILE VERIFICATION SYSTEM
   ---------------------------------------------------------
   Architecture (matches the target production design):

     USER → SECURE UPLOAD → BACKEND VALIDATION → PRIVATE STORAGE
           → GEMINI AI PRE-SCREENING → STRUCTURED AI REPORT
           → HUMAN ADMIN REVIEW → ADMIN FINAL DECISION → BADGE

   THIS IS A CLIENT-ONLY PROTOTYPE (single HTML file, localStorage).
   There is no real server here, so a few pieces are necessarily
   simulated — each is called out below with what a real backend
   would do instead:

   - GeminiVerificationService.preScreenVerification() below is a
     MOCK. It runs entirely in the browser and never calls Google's
     Gemini API. A real implementation would POST the verification
     id to a backend endpoint (e.g. POST /api/internal/verifications/:id/pre-screen),
     which would hold GEMINI_API_KEY server-side only, call Gemini,
     validate the JSON against a schema, and write the result back.
     A Gemini key must NEVER be embedded in a static frontend file
     like this one — that's why the call is mocked rather than real.
   - "Admin" is a demo-only boolean on the user record, toggleable
     from Settings → Account for testing. A real system enforces
     admin/reviewer permissions server-side on every request — a
     client-side flag like this is not real authorization.
   - Evidence files are stored inside localStorage (small images as
     base64; larger/video/document files as metadata + SHA-256 hash
     only, since browsers cap localStorage around 5–10MB total). A
     real system uses private object storage with signed, short-lived
     URLs, per spec §17.
   - All the AI-cannot-decide, human-must-decide, audit-log, and
     admin-override rules from the spec ARE enforced in this code.
   ========================================================= */

const VERIF_TYPES = [
  {id:'IDENTITY', label:'Identity', ic:'🪪', desc:'Confirm you are who your profile says you are.'},
  {id:'SKILL', label:'Skill', ic:'🎯', desc:'Verify a specific skill you teach.'},
  {id:'EDUCATION', label:'Education', ic:'🎓', desc:'Verify a degree, course, or certification.'},
  {id:'PROFESSIONAL', label:'Professional Experience', ic:'💼', desc:'Verify work or professional experience.'},
  {id:'ACHIEVEMENT', label:'Achievement', ic:'🏆', desc:'Verify an award, hackathon win, or similar achievement.'},
];
const DOC_TYPE_LABELS = {IDENTITY_DOCUMENT:'Identity Document', CERTIFICATE:'Certificate', DIPLOMA:'Diploma', AWARD:'Award', MARKSHEET:'Marksheet', PORTFOLIO:'Portfolio', ACHIEVEMENT:'Achievement Document', PROFESSIONAL_DOCUMENT:'Professional Document', VIDEO_EVIDENCE:'Video Evidence', IMAGE_EVIDENCE:'Image Evidence', OTHER:'Other'};
const RECOMMENDATION_LABELS = {
  READY_FOR_HUMAN_REVIEW:'Ready for human review',
  NEEDS_MORE_INFORMATION:'Needs more information',
  POTENTIAL_INCONSISTENCY:'Potential inconsistency',
  POTENTIAL_SECURITY_ISSUE:'Potential security issue',
  UNREADABLE_DOCUMENT:'Unreadable document',
  DUPLICATE_DOCUMENT:'Duplicate document',
};
const VALID_RECOMMENDATIONS = Object.keys(RECOMMENDATION_LABELS);
const VERIF_STATUS_META = {
  NOT_STARTED:{label:'Not Verified', cls:'st-not'},
  PENDING_AI_REVIEW:{label:'Submitted', cls:'st-pending'},
  AI_PROCESSING:{label:'AI Pre-Screening…', cls:'st-pending'},
  UNDER_REVIEW:{label:'Under Human Review', cls:'st-review'},
  MORE_INFORMATION_REQUIRED:{label:'More Info Requested', cls:'st-info'},
  VERIFIED:{label:'Verified', cls:'st-verified'},
  REJECTED:{label:'Rejected', cls:'st-rejected'},
  AI_REVIEW_FAILED:{label:'Awaiting Manual Review', cls:'st-pending'},
};
// Scaled down for a browser-localStorage demo (production limits from spec:
// images 10MB / documents 20MB / videos 100MB / 10 files / 500MB total).
const FILE_LIMITS = {
  image:{maxBytes:3*1024*1024, exts:['jpg','jpeg','png','webp']},
  document:{maxBytes:5*1024*1024, exts:['pdf','doc','docx','ppt','pptx']},
  video:{maxBytes:50*1024*1024, exts:['mp4','mov','webm']},
  maxFiles:5,
};
const BLOCKED_EXTS = ['exe','sh','bat','js','html','htm','msi','apk','com','cmd','ps1'];

function extOf(name){ const m=/\.([a-z0-9]+)$/i.exec(name||''); return m?m[1].toLowerCase():''; }
function classifyFile(file){
  const ext = extOf(file.name);
  if(BLOCKED_EXTS.includes(ext)) return {ok:false, reason:`.${ext} files are not allowed as evidence.`};
  if(FILE_LIMITS.image.exts.includes(ext)) return {ok:true, kind:'image', limit:FILE_LIMITS.image.maxBytes};
  if(FILE_LIMITS.document.exts.includes(ext)) return {ok:true, kind:'document', limit:FILE_LIMITS.document.maxBytes};
  if(FILE_LIMITS.video.exts.includes(ext)) return {ok:true, kind:'video', limit:FILE_LIMITS.video.maxBytes};
  return {ok:false, reason:`.${ext||'unknown'} is not a supported evidence file type.`};
}
async function sha256Hex(buf){
  try{
    const digest = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return null; } // crypto.subtle unavailable (e.g. non-HTTPS) — hashing is best-effort here.
}
function readFileAsDataURL(file){
  return new Promise((resolve)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = ()=> resolve(null);
    r.readAsDataURL(file);
  });
}

/* ---------- GeminiVerificationService (MOCK — see banner above) ---------- */
const GeminiVerificationService = {
  provider: 'google-gemini',
  model: 'gemini-2.5-flash', // would come from GEMINI_MODEL env config server-side
  version: 'mock-v1',

  /** Simulated async pre-screen. Never returns APPROVED/REJECTED/VERIFIED —
   *  only observations + a recommendation for the human reviewer. */
  async preScreenVerification(verification){
    await new Promise(res=> setTimeout(res, 1400 + Math.random()*900));

    // Simulated transient failure path (spec §34/§49: AI failure must
    // never block or auto-reject a verification — manual review continues).
    if(Math.random() < 0.06){
      return {ai_status:'FAILED', provider:this.provider, model:this.model, version:this.version, analysis:null};
    }

    const analysis = this._analyze(verification);
    if(!VALID_RECOMMENDATIONS.includes(analysis.recommendation)){
      return {ai_status:'FAILED', provider:this.provider, model:this.model, version:this.version, analysis:null};
    }
    return {ai_status:'COMPLETED', provider:this.provider, model:this.model, version:this.version, analysis};
  },

  // Uploaded file names/descriptions are treated as untrusted DATA, never
  // as instructions — this heuristic only ever reads them as text to match
  // keywords against; nothing here executes or "follows" file content.
  _analyze(v){
    const desc = (v.description||'').toLowerCase();
    const fileNames = v.documents.map(d=>d.fileName.toLowerCase()).join(' ');
    const haystack = desc + ' ' + fileNames;
    const flags = [];
    const missing = [];

    // quality
    let quality = v.documents.length ? 'GOOD' : 'POOR';
    let qualityNote = v.documents.length ? 'Files appear present and of a supported type.' : 'No evidence files were attached.';
    if(!v.documents.length) missing.push('No evidence documents attached.');

    // duplicate detection via file_hash against prior submissions
    const priorHashes = new Set(
      P.verifications.filter(x=>x.id!==v.id).flatMap(x=>x.documents.map(d=>d.fileHash)).filter(Boolean)
    );
    const dup = v.documents.some(d=> d.fileHash && priorHashes.has(d.fileHash));
    if(dup) flags.push('One or more files match a document already submitted elsewhere.');

    // skill relevance (SKILL type only)
    let skillRelevance = null;
    if(v.type==='SKILL' && v.skillName){
      const tokens = v.skillName.toLowerCase().split(/[\s.]+/).filter(t=>t.length>2);
      const hit = tokens.some(tok=> haystack.includes(tok));
      skillRelevance = {status: hit?'HIGH':'LOW', confidence: hit?0.9:0.52, notes: hit?'Evidence appears relevant to the claimed skill.':'Evidence does not obviously reference the claimed skill — potential inconsistency.'};
      if(!hit) flags.push('Potential inconsistency between claimed skill and evidence provided.');
    }

    // name consistency — no real OCR in this mock, so we're deliberately
    // conservative rather than claiming a match we can't actually check.
    const nameConsistency = {status: v.type==='IDENTITY' ? 'UNCLEAR' : 'LIKELY_MATCH', confidence: v.type==='IDENTITY'?0.4:0.7, notes:'Automated name matching is limited in this prototype; a production system would run OCR/text extraction here.'};

    if(desc.trim().length < 12) missing.push('Description is quite short — more context would help the reviewer.');

    let risk = 8;
    if(skillRelevance && skillRelevance.status==='LOW') risk += 35;
    if(!v.documents.length) risk += 35;
    if(dup) risk += 25;
    risk += missing.length * 8;
    if(v.type==='IDENTITY') risk += 10;
    risk = Math.max(0, Math.min(100, Math.round(risk)));

    let recommendation = 'READY_FOR_HUMAN_REVIEW';
    if(!v.documents.length) recommendation = 'NEEDS_MORE_INFORMATION';
    else if(dup) recommendation = 'DUPLICATE_DOCUMENT';
    else if(skillRelevance && skillRelevance.status==='LOW') recommendation = 'POTENTIAL_INCONSISTENCY';
    else if(risk > 55) recommendation = 'NEEDS_MORE_INFORMATION';

    return {
      document_type: {value: v.documents[0]?.documentType || 'OTHER', confidence: 0.7},
      quality: {status: quality, confidence: 0.85, notes: qualityNote},
      name_consistency: nameConsistency,
      skill_relevance: skillRelevance,
      achievement_consistency: v.type==='ACHIEVEMENT' ? {status:'CONSISTENT', confidence:0.75, notes:'Description and evidence appear aligned.'} : null,
      risk_flags: flags,
      missing_information: missing,
      risk_score: risk,
      recommendation,
    };
  }
};
function riskBand(score){
  if(score<=20) return {label:'LOW CONCERN', color:'var(--success)'};
  if(score<=50) return {label:'MODERATE CONCERN', color:'var(--amber)'};
  if(score<=75) return {label:'HIGH CONCERN', color:'#ff9a4d'};
  return {label:'VERY HIGH CONCERN', color:'var(--danger)'};
}

/* ---------- Verification lifecycle ---------- */
function genId(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

function addAudit(v, action, actorId, notes){
  v.auditLog.push({id:genId('log'), action, actorId, previousStatus:v._prevStatus||v.status, newStatus:v.status, notes:notes||'', createdAt:Date.now()});
  v._prevStatus = v.status;
}
function pushNotification(userId, message){
  const u = P.users[userId];
  if(!u) return;
  if(!u.notifications) u.notifications = [];
  u.notifications.unshift({id:genId('ntf'), message, createdAt:Date.now(), read:false});
  u.notifications = u.notifications.slice(0,30);
}

function getMyVerifications(){ return P.verifications.filter(v=> v.userId===P.currentUserId).sort((a,b)=>b.submittedAt-a.submittedAt || b.createdAt-a.createdAt); }
function getVerificationById(id){ return P.verifications.find(v=>v.id===id); }
function overallVerificationStatus(){
  const mine = getMyVerifications();
  if(mine.some(v=>v.status==='VERIFIED')) return 'VERIFIED';
  if(mine.some(v=>v.status==='UNDER_REVIEW'||v.status==='AI_PROCESSING'||v.status==='PENDING_AI_REVIEW'||v.status==='AI_REVIEW_FAILED')) return 'UNDER_REVIEW';
  if(mine.some(v=>v.status==='MORE_INFORMATION_REQUIRED')) return 'MORE_INFORMATION_REQUIRED';
  return 'NOT_STARTED';
}

function newVerificationDraft(){
  UI.verifyDraft = {step:1, type:null, skillName:'', description:'', files:[], busy:false};
}
function verifDraftNext(){
  const d = UI.verifyDraft;
  if(d.step===1 && !d.type){ toast('Choose what you want to verify.'); return; }
  if(d.step===2 && d.type==='SKILL' && !d.skillName){ toast('Choose a skill.'); return; }
  const skipSkillStep = d.type!=='SKILL';
  if(d.step===1) d.step = skipSkillStep ? 3 : 2;
  else if(d.step===2) d.step = 3;
  else if(d.step===3) d.step = 4;
  render();
}
function verifDraftBack(){
  const d = UI.verifyDraft;
  const skipSkillStep = d.type!=='SKILL';
  if(d.step===4) d.step = 3;
  else if(d.step===3) d.step = skipSkillStep ? 1 : 2;
  else if(d.step===2) d.step = 1;
  render();
}
async function verifDraftAddFiles(fileList){
  const d = UI.verifyDraft;
  const files = Array.from(fileList||[]);
  if(d.files.length + files.length > FILE_LIMITS.maxFiles){
    toast(`You can attach up to ${FILE_LIMITS.maxFiles} files.`); return;
  }
  for(const file of files){
    const cls = classifyFile(file);
    if(!cls.ok){ toast(cls.reason); continue; }
    if(file.size > cls.limit){ toast(`${file.name} is over the ${(cls.limit/1024/1024).toFixed(0)}MB limit for this file type.`); continue; }
    const buf = await file.arrayBuffer();
    const hash = await sha256Hex(buf);
    // Only small images are embedded as a data URL preview; everything
    // else is stored as metadata + hash (see storage note in banner above).
    const dataUrl = (cls.kind==='image' && file.size < 900*1024) ? await readFileAsDataURL(file) : null;
    d.files.push({
      id:genId('doc'), fileName:esc(file.name), mimeType:file.type||'application/octet-stream',
      fileSize:file.size, fileHash:hash, kind:cls.kind, dataUrl,
      documentType: cls.kind==='image'?'IMAGE_EVIDENCE':(cls.kind==='video'?'VIDEO_EVIDENCE':'CERTIFICATE'),
    });
  }
  render();
}
function verifDraftRemoveFile(id){ UI.verifyDraft.files = UI.verifyDraft.files.filter(f=>f.id!==id); render(); }

async function submitVerification(){
  const d = UI.verifyDraft;
  if(!d.type){ toast('Choose what you want to verify.'); return; }
  if(d.files.length===0){ toast('Attach at least one evidence file before submitting.'); return; }
  d.busy = true; render();

  const v = {
    id: genId('ver'), userId: P.currentUserId, type: d.type,
    skillName: d.type==='SKILL' ? d.skillName : null,
    description: esc(d.description||''),
    documents: d.files,
    status: 'PENDING_AI_REVIEW',
    submittedAt: Date.now(), createdAt: Date.now(),
    reviewedAt:null, reviewedBy:null, adminDecision:null, adminNotes:'',
    aiPreScreening: null,
    auditLog: [],
  };
  addAudit(v, 'SUBMITTED', P.currentUserId, 'Verification submitted by user.');
  P.verifications.unshift(v);
  save();
  pushNotification(v.userId, `Your ${VERIF_TYPES.find(t=>t.id===v.type)?.label||v.type} verification was submitted.`);
  toast('Submitted — AI pre-screening in progress…');
  go('verifyDetail', {id:v.id});

  // Background AI pre-screening job (simulated — see service banner above).
  v.status = 'AI_PROCESSING'; addAudit(v, 'AI_PROCESSING', 'system', 'Background pre-screening started.'); save(); if(UI.view==='verifyDetail'&&UI.params.id===v.id) render();

  const result = await GeminiVerificationService.preScreenVerification(v);
  if(result.ai_status==='FAILED'){
    v.aiPreScreening = {status:'FAILED', provider:result.provider, model:result.model, version:result.version, riskScore:null, recommendation:null, analysisJson:null, completedAt:Date.now()};
    v.status = 'UNDER_REVIEW'; // AI failure never blocks — falls straight to manual review
    addAudit(v, 'AI_FAILED', 'system', 'AI pre-screening failed — routed directly to manual review.');
  } else {
    v.aiPreScreening = {status:'COMPLETED', provider:result.provider, model:result.model, version:result.version, riskScore:result.analysis.risk_score, recommendation:result.analysis.recommendation, analysisJson:result.analysis, completedAt:Date.now()};
    v.status = 'UNDER_REVIEW';
    addAudit(v, 'AI_COMPLETED', 'system', `AI recommendation: ${result.analysis.recommendation}.`);
  }
  save();
  Object.values(P.users).filter(u=>u.isAdmin).forEach(a=> pushNotification(a.id, `New verification ready for review (${v.type}).`));
  if(UI.view==='verifyDetail' && UI.params.id===v.id) render();
}

function adminDecide(verId, decision, notes){
  const v = getVerificationById(verId);
  if(!v) return;
  const admin = me();
  if(!admin || !admin.isAdmin){ toast('Admin access required.'); return; }
  v.adminDecision = decision;
  v.adminNotes = esc(notes||'');
  v.reviewedBy = admin.id;
  v.reviewedAt = Date.now();

  if(decision==='APPROVE'){
    v.status = 'VERIFIED';
    addAudit(v, 'APPROVED', admin.id, notes);
    const owner = P.users[v.userId];
    if(owner){
      owner.profileVerified = true;
      if(v.type==='SKILL' && v.skillName){
        const item = owner.teach.find(t=>t.skill===v.skillName);
        if(item){ item.verified = true; item.evidenceVerified = true; }
      }
    }
    pushNotification(v.userId, 'Your verification has been reviewed and approved.');
  } else if(decision==='REJECT'){
    v.status = 'REJECTED';
    addAudit(v, 'REJECTED', admin.id, notes);
    pushNotification(v.userId, 'Your verification was reviewed and not approved. See notes for details.');
  } else if(decision==='MORE_INFO'){
    v.status = 'MORE_INFORMATION_REQUIRED';
    addAudit(v, 'MORE_INFORMATION_REQUESTED', admin.id, notes);
    pushNotification(v.userId, 'The reviewer requested more information for your verification.');
  }
  save();
  render();
}

const SPLASH_SESSION_KEY = 'skillsync_splash_shown_v1';
function maybeShowSplash(){
  try{
    if(sessionStorage.getItem(SPLASH_SESSION_KEY)) return;
  }catch(e){ return; }
  const root = document.getElementById('splash-root');
  if(!root) return;
  root.innerHTML = `
    <div class="splash-overlay" id="splash-overlay">
      <button class="splash-mark" id="splash-mark" onclick="dismissSplash()" aria-label="Enter SkillSync">
        <img src="${SKILLSYNC_LOGO}" alt="SkillSync">
      </button>
      <div class="splash-hint">Tap to continue</div>
    </div>`;
  const markBtn = document.getElementById('splash-mark');
  if(markBtn) markBtn.focus({preventScroll:true});
  document.addEventListener('keydown', splashKeyHandler);
  try{ sessionStorage.setItem(SPLASH_SESSION_KEY, '1'); }catch(e){}
}
function splashKeyHandler(e){
  if(e.key==='Enter' || e.key===' ' || e.key==='Escape'){
    e.preventDefault();
    dismissSplash();
  }
}
function dismissSplash(){
  document.removeEventListener('keydown', splashKeyHandler);
  const overlay = document.getElementById('splash-overlay');
  const mark = document.getElementById('splash-mark');
  if(!overlay){ return; }
  overlay.classList.add('closing');
  if(mark) mark.classList.add('closing');
  const remove = ()=>{ const root = document.getElementById('splash-root'); if(root) root.innerHTML=''; };
  if(document.documentElement.classList.contains('reduced-motion')){
    remove();
  } else {
    setTimeout(remove, 320);
  }
}

/* ---------- Screen-privacy (best effort) ----------
   Blurs the app when the tab loses focus or is backgrounded, so
   private-looking content (profile, requests) isn't left glowing on
   screen if someone glances over. This is a deterrent, not a
   guarantee — it cannot detect or block screenshots, screen
   recording, devtools, or a second camera pointed at the screen.
   See the Privacy & Security panel and SECURITY.md for the honest
   version of this claim. */
function initScreenPrivacy(){
  const style = document.createElement('style');
  style.textContent = `
    #app.privacy-blur{ filter: blur(14px) brightness(0.6); transition: filter .15s ease; pointer-events:none; }
    #privacy-shield{ position:fixed; inset:0; z-index:400; display:none; align-items:center; justify-content:center;
      background:rgba(5,6,12,.55); backdrop-filter:blur(2px); color:#EDEDF7; font-family:'Inter',sans-serif; font-size:14px; text-align:center; padding:24px; }
    #privacy-shield.show{ display:flex; }
  `;
  document.head.appendChild(style);
  const shield = document.createElement('div');
  shield.id = 'privacy-shield';
  shield.innerHTML = '<div>🔒 Content hidden while this tab is not in focus.</div>';
  document.body.appendChild(shield);
  const setHidden = (hidden)=>{
    const app = document.getElementById('app');
    if(!app) return;
    app.classList.toggle('privacy-blur', hidden);
    shield.classList.toggle('show', hidden);
  };
  document.addEventListener('visibilitychange', ()=> setHidden(document.hidden));
  window.addEventListener('blur', ()=> setHidden(true));
  window.addEventListener('focus', ()=> setHidden(false));
}

function boot(){
  applySettings();
  if(P.currentUserId && P.users[P.currentUserId]){
    const u = P.users[P.currentUserId];
    UI.view = (u.teach.length||u.learn.length) ? 'dashboard' : 'purpose';
  } else {
    UI.view = 'landing';
  }
  render();
  maybeShowSplash();
  initScreenPrivacy();
}
boot();
