<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Sync — Learn. Teach. Connect.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Poppins:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@600;700&family=Karla:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== Theme: Default (dark) — this block is the fallback theme.
     Every [data-theme="..."] block below re-declares this same variable
     set; component CSS should never reference a raw color, only these
     custom properties, so a new theme is just a new block here. ===== */
  --bg:#0A0B14; --bg-elev:#10121F; --bg-elev2:#161829;
  --violet:#8B7FFF; --violet-dim:#5B4FCF; --violet2:var(--violet2); --cyan:#4CE0D2; --cyan2:var(--cyan2); --amber:#FFB84D;
  --text:#EDEDF7; --text-dim:#9B9BB8; --text-faint:#63647E;
  --border:rgba(255,255,255,.08); --border-soft:rgba(255,255,255,.05);
  --danger:#FF6B7A; --success:#5FE3A1;
  --radius:18px; --radius-sm:12px;
  --glow-violet: 0 0 40px rgba(139,127,255,.25);
  --glow-cyan: 0 0 40px rgba(76,224,210,.2);
  --on-accent:#0A0B14;
  --card-shadow: 0 16px 40px rgba(0,0,0,.35);
  --font-display:'Sora',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  --heading-tracking:-0.02em; --card-clip:none;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  min-height:100vh; position:relative; overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    radial-gradient(circle at 15% 10%, rgba(139,127,255,.14), transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(76,224,210,.10), transparent 40%),
    radial-gradient(circle at 50% 90%, rgba(139,127,255,.08), transparent 45%),
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:auto,auto,auto,44px 44px,44px 44px;
}
h1,h2,h3,.display{font-family:var(--font-display); letter-spacing:var(--heading-tracking);}
.mono{font-family:var(--font-mono);}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
::selection{background:rgba(139,127,255,.35);}
::-webkit-scrollbar{width:10px;} ::-webkit-scrollbar-thumb{background:#26283e; border-radius:10px;}

#app{position:relative; z-index:1; min-height:100vh; padding-bottom:70px;}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
.narrow{max-width:760px; margin:0 auto; padding:0 24px;}

/* ---------- Nav ---------- */
.topnav{
  position:sticky; top:0; z-index:50; backdrop-filter:blur(16px);
  background:rgba(10,11,20,.72); border-bottom:1px solid var(--border);
}
.topnav-inner{max-width:1180px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px;}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:800; font-size:19px;}
.brand .dot-sync{width:9px; height:9px; border-radius:50%; background:linear-gradient(135deg,var(--violet),var(--cyan)); box-shadow:0 0 14px rgba(139,127,255,.7);}
.brand-mark{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; flex-shrink:0; border:none; padding:0; background:transparent; cursor:pointer; transition:transform .18s ease-out;}
.brand-mark img{width:100%; height:100%; object-fit:contain; display:block; border-radius:50%;}
.brand-mark:hover{transform:scale(1.03);}
.brand-mark:focus-visible{outline:2px solid var(--violet); outline-offset:3px; border-radius:50%;}
@media(max-width:880px){.brand-mark{width:36px; height:36px;}}
@media(max-width:520px){.brand-mark{width:30px; height:30px;}}
html[data-theme="light"] .brand-mark,
html[data-theme="coquette"] .brand-mark,
html[data-theme="kawaii"] .brand-mark,
html[data-theme="sketch"] .brand-mark{background:rgba(20,21,31,.06); box-shadow:0 0 0 1px rgba(20,21,31,.05);}
html[data-theme="coquette"] .brand-mark{background:rgba(139,58,74,.06); box-shadow:0 0 0 1px rgba(139,58,74,.06);}
html[data-theme="kawaii"] .brand-mark{background:rgba(179,157,219,.1); box-shadow:0 0 0 1px rgba(179,157,219,.12);}
/* ---------- Splash / logo reveal ---------- */
@keyframes splashPop{0%{opacity:0; transform:scale(.8) translateY(6px);} 100%{opacity:1; transform:scale(1) translateY(0);}}
@keyframes splashOut{0%{opacity:1; transform:scale(1);} 100%{opacity:0; transform:scale(.94);}}
.splash-overlay{position:fixed; inset:0; z-index:300; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:rgba(5,6,12,.86); backdrop-filter:blur(6px); animation:fadeIn .3s ease; -webkit-tap-highlight-color:transparent;}
html[data-theme="light"] .splash-overlay,
html[data-theme="coquette"] .splash-overlay,
html[data-theme="kawaii"] .splash-overlay,
html[data-theme="sketch"] .splash-overlay{background:rgba(243,244,250,.92);}
.splash-overlay.closing{animation:fadeIn .28s ease reverse;}
.splash-mark{width:168px; height:168px; border-radius:50%; cursor:pointer; border:none; background:transparent; padding:0; box-shadow:0 0 60px rgba(139,127,255,.35); animation:splashPop .6s cubic-bezier(.2,.9,.25,1.1) both; transition:transform .2s ease-out;}
.splash-mark:hover{transform:scale(1.02);}
.splash-mark:focus-visible{outline:2px solid var(--violet); outline-offset:4px;}
.splash-mark img{width:100%; height:100%; object-fit:contain; border-radius:50%; display:block;}
.splash-mark.closing{animation:splashOut .3s ease forwards;}
.splash-hint{font-size:13px; color:var(--text-dim); animation:fadeIn .6s ease .2s both;}
.splash-overlay.closing .splash-hint{animation:none; opacity:0;}
@media(max-width:520px){.splash-mark{width:124px; height:124px;} .splash-overlay{gap:14px;}}
html.reduced-motion .splash-overlay{animation:none;}
html.reduced-motion .splash-overlay.closing{animation:none; opacity:0;}
html.reduced-motion .splash-mark{animation:none;}
html.reduced-motion .splash-mark.closing{animation:none; opacity:0;}
html.reduced-motion .splash-hint{animation:none;}
.nav-links{display:flex; gap:4px; align-items:center;}
.nav-link{padding:8px 14px; border-radius:100px; font-size:14px; font-weight:500; color:var(--text-dim); transition:.2s;}
.nav-link:hover{color:var(--text); background:var(--border-soft);}
.nav-link.active{color:var(--text); background:rgba(139,127,255,.14); box-shadow:inset 0 0 0 1px rgba(139,127,255,.3);}
.nav-right{display:flex; align-items:center; gap:10px;}
.avatar{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--violet),var(--cyan)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--on-accent); flex-shrink:0;}
.avatar.sm{width:26px;height:26px;font-size:11px;}
.avatar.lg{width:64px;height:64px;font-size:22px;}
.usermenu-wrap{position:relative;}
.usermenu{position:absolute; top:44px; right:0; background:var(--bg-elev2); border:1px solid var(--border); border-radius:var(--radius-sm); min-width:180px; padding:6px; box-shadow:0 20px 50px rgba(0,0,0,.5); display:none; flex-direction:column;}
.usermenu.open{display:flex;}
.usermenu button{padding:9px 12px; border-radius:9px; text-align:left; font-size:13.5px; color:var(--text-dim);}
.usermenu button:hover{background:var(--border-soft); color:var(--text);}
.theme-toggle{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; background:var(--border-soft); border:1px solid var(--border); flex-shrink:0; transition:.2s;}
.theme-toggle:hover{background:rgba(255,255,255,.09);}
.theme-picker{position:absolute; top:44px; right:0; background:var(--bg-elev2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; box-shadow:0 20px 50px rgba(0,0,0,.5); display:none; z-index:60; width:220px;}
.creators-toggle-wrap{position:relative; display:inline-flex;}
.creators-toggle-wrap .ct-label{display:none; position:absolute; top:44px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:11.5px; font-weight:600; color:var(--text-dim); background:var(--bg-elev2); border:1px solid var(--border); border-radius:8px; padding:5px 10px; box-shadow:0 12px 30px rgba(0,0,0,.4); z-index:60;}
.creators-toggle-wrap:hover .ct-label, .creators-toggle-wrap .theme-toggle:focus-visible ~ .ct-label{display:block;}
.creators-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:900px; margin:0 auto;}
@media(max-width:700px){.creators-grid{grid-template-columns:1fr;}}
.creator-card{text-align:center;}
.creator-avatar{width:88px; height:88px; border-radius:50%; margin:0 auto 16px; background:linear-gradient(135deg,var(--violet),var(--cyan)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:28px; color:var(--on-accent); overflow:hidden;}
.creator-avatar img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
.creator-card h3{margin-bottom:6px;}
.creator-card .bio{color:var(--text-dim); font-size:13.5px; line-height:1.55; margin-bottom:14px;}
.creator-linkedin{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--violet);}
.creator-linkedin:hover{text-decoration:underline;}
.theme-picker.open{display:block;}
.theme-picker .tp-title{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); font-weight:700; margin-bottom:10px; font-family:var(--font-mono);}
.theme-picker .tp-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.theme-swatch{display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 4px; border-radius:10px; cursor:pointer; border:1px solid transparent; transition:.15s;}
.theme-swatch:hover{background:var(--border-soft);}
.theme-swatch.active{border-color:var(--violet); background:rgba(139,127,255,.1);}
.theme-swatch .ts-dot{width:26px; height:26px; border-radius:50%; box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);}
.theme-swatch .ts-label{font-size:10.5px; color:var(--text-dim); font-weight:600; text-align:center; line-height:1.2;}
.theme-swatch.active .ts-label{color:var(--text);}
@media(max-width:880px){ .nav-links{display:none;} }

.bottomnav{display:none;}
@media(max-width:880px){
  .bottomnav{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:rgba(16,18,31,.92); backdrop-filter:blur(16px); border-top:1px solid var(--border);
    justify-content:space-around; padding:8px 4px 10px;
  }
  .bnav-item{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px; color:var(--text-faint); font-weight:500; padding:4px 6px;}
  .bnav-item .ic{font-size:18px;}
  .bnav-item.active{color:var(--violet);}
}

/* ---------- Buttons ---------- */
.btn{padding:13px 26px; border-radius:100px; font-weight:600; font-size:14.5px; display:inline-flex; align-items:center; gap:8px; transition:.2s; white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,var(--violet),var(--violet2)); color:#fff; box-shadow:0 8px 24px rgba(139,127,255,.35);}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 12px 30px rgba(139,127,255,.5);}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),var(--cyan2)); color:var(--on-accent); box-shadow:0 8px 24px rgba(76,224,210,.3);}
.btn-cyan:hover{transform:translateY(-2px);}
.btn-ghost{background:var(--border-soft); border:1px solid var(--border); color:var(--text);}
.btn-ghost:hover{background:rgba(255,255,255,.09);}
.btn-outline{border:1px solid rgba(139,127,255,.5); color:var(--violet);}
.btn-outline:hover{background:rgba(139,127,255,.1);}
.btn-danger-o{border:1px solid rgba(255,107,122,.4); color:var(--danger);}
.btn-danger-o:hover{background:rgba(255,107,122,.1);}
.btn-sm{padding:8px 16px; font-size:13px;}
.btn-block{width:100%; justify-content:center;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none !important;}

/* ---------- Cards / glass ---------- */
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
  border:1px solid var(--border); border-radius:var(--radius); padding:22px;
  backdrop-filter:blur(10px);
}
.card-hover{transition:.25s;}
.card-hover:hover{transform:translateY(-4px); border-color:rgba(139,127,255,.35); box-shadow:0 16px 40px rgba(0,0,0,.35);}
.eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan); font-weight:600; font-family:var(--font-mono);}

/* ---------- Chips ---------- */
.chip{
  display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:100px;
  border:1px solid var(--border); background:var(--border-soft); font-size:13.5px; font-weight:500;
  color:var(--text-dim); cursor:pointer; transition:.18s; user-select:none;
}
.chip:hover{border-color:rgba(139,127,255,.4); color:var(--text);}
.chip.selected{background:rgba(139,127,255,.16); border-color:var(--violet); color:#fff; box-shadow:0 0 0 1px rgba(139,127,255,.25);}
.chip.static{cursor:default;}
.chip-wrap{display:flex; flex-wrap:wrap; gap:9px;}

/* ---------- Buddy filter panel / active filter chips ---------- */
.filter-btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:100px;
  border:1px solid var(--border); background:var(--border-soft); font-size:13.5px; font-weight:500;
  color:var(--text-dim); cursor:pointer; transition:.18s; user-select:none;
}
.filter-btn:hover{border-color:rgba(139,127,255,.4); color:var(--text);}
.filter-btn.active{background:rgba(139,127,255,.16); border-color:var(--violet); color:#fff; box-shadow:0 0 0 1px rgba(139,127,255,.25);}
.filter-panel-section{margin-bottom:18px;}
.filter-panel-section:last-child{margin-bottom:0;}
.filter-panel-label{font-size:12.5px; color:var(--text-dim); margin-bottom:8px; font-weight:600;}
.active-filters-row{display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-bottom:14px;}
.active-filter-chip{
  display:inline-flex; align-items:center; gap:7px; padding:7px 10px 7px 13px; border-radius:100px;
  background:rgba(139,127,255,.12); border:1px solid rgba(139,127,255,.3); font-size:12.5px; color:var(--text);
}
.active-filter-chip .x{cursor:pointer; opacity:.65; font-weight:700; line-height:1;}
.active-filter-chip .x:hover{opacity:1; color:var(--danger);}
.clear-all-link{font-size:12.5px; color:var(--text-dim); cursor:pointer; text-decoration:underline; text-underline-offset:2px;}
.clear-all-link:hover{color:var(--text);}
.result-count{color:var(--text-dim); font-size:13px; margin:0 0 16px;}
@media(max-width:600px){ .modal-box.filter-modal{max-width:100%;} }

/* ---------- Progress ---------- */
.progress-track{height:9px; border-radius:100px; background:var(--border-soft); overflow:hidden; border:1px solid var(--border);}
.progress-fill{height:100%; border-radius:100px; background:linear-gradient(90deg,var(--violet),var(--cyan)); transition:width .6s cubic-bezier(.4,0,.2,1);}
.progress-fill.amber{background:linear-gradient(90deg,#FFB84D,#FF9F5A);}

/* ---------- Sync Beam (signature element) ---------- */
.sync-beam{display:flex; align-items:center; justify-content:center; gap:0; position:relative;}
.sb-node{width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; z-index:2; box-shadow:0 0 0 4px var(--bg);}
.sb-node.a{background:linear-gradient(135deg,var(--violet),var(--violet2));}
.sb-node.b{background:linear-gradient(135deg,var(--cyan),var(--cyan2));}
.sb-line{flex:1; height:2px; min-width:40px; max-width:120px; position:relative; background:linear-gradient(90deg,var(--violet),var(--cyan)); overflow:visible;}
.sb-line::after{content:''; position:absolute; top:-3px; width:8px; height:8px; border-radius:50%; background:#fff; box-shadow:0 0 10px 2px #fff; animation:travel 2.2s linear infinite;}
@keyframes travel{0%{left:0; opacity:0;} 10%{opacity:1;} 90%{opacity:1;} 100%{left:100%; opacity:0;}}
.sb-score{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--bg-elev2); border:1px solid rgba(139,127,255,.5); border-radius:100px; padding:5px 13px; font-family:var(--font-mono); font-weight:700; font-size:13px; box-shadow:0 0 20px rgba(139,127,255,.35); z-index:3; white-space:nowrap;}

/* ---------- Landing ---------- */
.hero{padding:90px 24px 70px; text-align:center; position:relative;}
.hero-badge{display:inline-flex; align-items:center; gap:8px; padding:7px 16px; border-radius:100px; border:1px solid var(--border); background:var(--border-soft); font-size:12.5px; color:var(--text-dim); margin-bottom:28px; font-family:var(--font-mono);}
.hero h1{font-size:clamp(40px,7vw,76px); font-weight:800; line-height:1.02; margin-bottom:20px;}
.hero h1 .grad{background:linear-gradient(135deg,var(--violet),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero-quote{font-size:clamp(16px,2.4vw,20px); color:var(--text-dim); font-style:italic; max-width:600px; margin:0 auto 8px; line-height:1.5;}
.hero-sub{max-width:600px; margin:22px auto 36px; color:var(--text-dim); font-size:16px; line-height:1.65;}
.hero-ctas{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:60px;}
.section{padding:70px 24px;}
.section-head{text-align:center; margin-bottom:48px;}
.section-head h2{font-size:clamp(28px,4vw,40px); font-weight:800; margin-bottom:12px;}
.section-head p{color:var(--text-dim); font-size:15.5px;}
.steps-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; max-width:1000px; margin:0 auto;}
@media(max-width:800px){.steps-grid{grid-template-columns:1fr;}}
.step-card{padding:30px 24px;}
.step-num{font-family:var(--font-mono); font-size:13px; color:var(--violet); font-weight:700; margin-bottom:14px;}
.step-card h3{font-size:19px; margin-bottom:8px; font-weight:700;}
.step-card p{color:var(--text-dim); font-size:14px; line-height:1.55;}
.why-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; max-width:1000px; margin:0 auto;}
@media(max-width:800px){.why-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.why-grid{grid-template-columns:1fr;}}
.why-card{padding:22px; text-align:center;}
.why-card .ic{font-size:26px; margin-bottom:10px;}
.why-card p{font-size:14px; font-weight:600;}
.exchange-demo{max-width:480px; margin:0 auto; padding:34px 24px; text-align:center;}
.final-cta{text-align:center; padding:90px 24px; background:radial-gradient(ellipse at center, rgba(139,127,255,.1), transparent 65%);}
.final-cta h2{font-size:clamp(26px,4vw,38px); max-width:640px; margin:0 auto 30px; font-weight:800; line-height:1.25;}
.landing-foot{text-align:center; padding:30px; color:var(--text-faint); font-size:13px; border-top:1px solid var(--border-soft);}

/* ---------- Landing Carousel (full-screen slides, landing page ONLY) ----------
   Scoped entirely to .landing-page / html.no-scroll — never applied to any
   authenticated view. Reuses .hero/.section/.step-card/.why-card/.final-cta/
   .card/.chip/.match-card/.karma-card/.sync-beam etc. so every theme's
   existing per-component overrides (coquette ribbons, kawaii ears, sketch
   doodles, scifi hex panels...) keep applying unchanged. */
html.no-scroll, html.no-scroll body{overflow:hidden; height:100%;}
.landing-page{height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; position:relative;}
.landing-page .topnav{flex:0 0 auto;}
.landing-carousel{position:relative; flex:1 1 auto; min-height:0; overflow:hidden; display:flex; flex-direction:column;}
.landing-carousel:focus{outline:none;}
.ls-viewport{position:relative; flex:1 1 auto; min-height:0; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:22px 24px 6px;}
.ls-slide{width:100%; max-width:1080px; margin:0 auto; max-height:100%; overflow-y:auto; overflow-x:hidden; padding:6px 6px 14px;}
.ls-slide::-webkit-scrollbar{width:6px;}
.ls-slide.ls-anim-next{animation:lsInNext .48s cubic-bezier(.22,.9,.32,1) both;}
.ls-slide.ls-anim-prev{animation:lsInPrev .48s cubic-bezier(.22,.9,.32,1) both;}
@keyframes lsInNext{from{opacity:0; transform:translateX(34px);} to{opacity:1; transform:translateX(0);}}
@keyframes lsInPrev{from{opacity:0; transform:translateX(-34px);} to{opacity:1; transform:translateX(0);}}
html.reduced-motion .ls-slide.ls-anim-next, html.reduced-motion .ls-slide.ls-anim-prev{animation:none;}

.lc-arrow{position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--border-soft); border:1px solid var(--border); color:var(--text); font-size:18px; z-index:10; transition:.18s; cursor:pointer;}
.lc-arrow:hover{background:rgba(139,127,255,.16); border-color:var(--violet); transform:translateY(-50%) scale(1.06);}
.lc-arrow:focus-visible{outline:2px solid var(--violet); outline-offset:2px;}
.lc-arrow.lc-prev{left:16px;} .lc-arrow.lc-next{right:16px;}
.lc-arrow[disabled]{opacity:0; pointer-events:none;}
@media(max-width:640px){.lc-arrow{width:36px; height:36px; font-size:15px;} .lc-arrow.lc-prev{left:6px;} .lc-arrow.lc-next{right:6px;}}

.lc-footer{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:9px; padding:4px 24px 18px;}
.lc-dots{display:flex; gap:8px;}
.lc-dot{width:8px; height:8px; border-radius:50%; background:var(--border); border:none; transition:.2s; cursor:pointer; padding:0;}
.lc-dot:hover{background:rgba(139,127,255,.4);}
.lc-dot.active{width:22px; border-radius:100px; background:linear-gradient(90deg,var(--violet),var(--cyan));}
.lc-dot:focus-visible{outline:2px solid var(--violet); outline-offset:2px;}
.lc-meta{display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:11px; color:var(--text-faint);}
.lc-progress-track{width:110px; height:3px; border-radius:100px; background:var(--border-soft); overflow:hidden;}
.lc-progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--violet),var(--cyan)); transition:width .15s linear;}
html.reduced-motion .lc-progress-fill{transition:none;}

.lc-bg{position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none;}
.lc-blob{position:absolute; border-radius:50%; filter:blur(60px); opacity:.32; animation:lcFloat 17s ease-in-out infinite alternate;}
.lc-blob.b1{width:340px; height:340px; background:var(--violet); top:-10%; left:-8%;}
.lc-blob.b2{width:300px; height:300px; background:var(--cyan); bottom:-12%; right:-6%; animation-delay:-6s;}
.lc-blob.b3{width:220px; height:220px; background:#FF6FB5; top:38%; right:16%; animation-delay:-11s; opacity:.2;}
@keyframes lcFloat{from{transform:translate(0,0) scale(1);} to{transform:translate(22px,-16px) scale(1.08);}}
html.reduced-motion .lc-blob{animation:none;}
.ls-viewport > *:not(.lc-bg){position:relative; z-index:1;}

/* New slide layouts (slides 4–6 have no pre-existing landing section, so
   these are the only genuinely new component classes added). */
.ls-exchange{text-align:center;}
.ls-exchange-row{display:flex; align-items:center; justify-content:center; gap:20px; flex-wrap:wrap; margin:28px 0 18px;}
.ls-exchange-side{min-width:160px;}
.ls-exchange-side .lbl{font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; color:var(--text-faint); margin-bottom:10px; text-transform:uppercase;}
.ls-exchange-side .chip{margin:3px;}
.ls-exchange-icon{width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; background:linear-gradient(135deg,var(--violet),var(--cyan)); color:var(--on-accent); flex-shrink:0; box-shadow:0 0 24px rgba(139,127,255,.35);}
.ls-currency-line{font-size:clamp(17px,2.4vw,23px); font-weight:800; max-width:560px; margin:6px auto 0;}
.ls-match-wrap{display:flex; justify-content:center; margin-top:8px;}
.ls-match-card{max-width:340px; width:100%;}
.ls-rep-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; max-width:820px; margin:26px auto 0;}
@media(max-width:760px){.ls-rep-grid{grid-template-columns:1fr 1fr;}}
.ls-rep-item{text-align:center; padding:18px 12px;}
.ls-rep-item .ic{font-size:22px; margin-bottom:8px;}
.ls-rep-item .lbl{font-size:12px; font-weight:700;}
@media(max-width:640px){
  .hero{padding-top:20px;} .section{padding:10px 20px;} .final-cta{padding:20px 20px;}
  .ls-viewport{padding:14px 16px 4px;}
}

/* ---------- Auth ---------- */
.auth-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;}
.auth-card{width:100%; max-width:420px; padding:36px 30px;}
.auth-card h2{font-size:26px; text-align:center; margin-bottom:6px; font-weight:800;}
.auth-card .sub{text-align:center; color:var(--text-dim); font-size:14px; margin-bottom:28px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:7px; font-weight:600;}
.field input, .field textarea, .field select{
  width:100%; padding:12px 14px; border-radius:11px; border:1px solid var(--border);
  background:rgba(255,255,255,.03); color:var(--text); font-size:14.5px; font-family:inherit;
}
.field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--violet); box-shadow:0 0 0 3px rgba(139,127,255,.18);}
.field .err{color:var(--danger); font-size:12px; margin-top:6px;}
.field.has-err input{border-color:var(--danger);}
.divider{display:flex; align-items:center; gap:12px; margin:22px 0; color:var(--text-faint); font-size:12px;}
.divider::before,.divider::after{content:''; flex:1; height:1px; background:var(--border);}
.google-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:12px; border-radius:11px; border:1px solid var(--border); background:#fff; color:#1f1f1f; font-weight:600; font-size:14px;}
.google-btn:hover{background:#f2f2f2;}
.auth-toggle{text-align:center; margin-top:20px; font-size:13.5px; color:var(--text-dim);}
.auth-toggle b{color:var(--violet); cursor:pointer;}
.tabs{display:flex; background:var(--border-soft); border-radius:100px; padding:4px; margin-bottom:24px; border:1px solid var(--border);}
.tab{flex:1; text-align:center; padding:9px; border-radius:100px; font-size:13.5px; font-weight:600; color:var(--text-dim);}
.tab.active{background:linear-gradient(135deg,var(--violet),var(--violet2)); color:#fff;}

/* ---------- Purpose cards ---------- */
.purpose-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; max-width:900px; margin:40px auto 0;}
@media(max-width:800px){.purpose-grid{grid-template-columns:1fr;}}
.purpose-card{padding:34px 24px; text-align:center; cursor:pointer; position:relative;}
.purpose-card.emph{border-color:rgba(139,127,255,.5); box-shadow:var(--glow-violet);}
.purpose-card .big-ic{font-size:40px; margin-bottom:16px;}
.purpose-card h3{font-size:18px; margin-bottom:8px;}
.purpose-card p{color:var(--text-dim); font-size:13.5px; line-height:1.5;}
.purpose-card .tag{position:absolute; top:14px; right:14px; font-size:10.5px; font-family:var(--font-mono); background:rgba(139,127,255,.18); color:var(--violet); padding:3px 9px; border-radius:100px;}

/* ---------- generic page shell ---------- */
.page{padding:44px 24px 60px;}
.page-head{margin-bottom:32px;}
.page-head .eyebrow{margin-bottom:8px; display:block;}
.page-head h1{font-size:clamp(24px,3.4vw,34px); font-weight:800;}
.page-head p{color:var(--text-dim); margin-top:8px; font-size:14.5px;}
.progress-top{max-width:520px; margin:0 auto 34px; display:flex; gap:8px;}
.progress-top .seg{flex:1; height:5px; border-radius:10px; background:var(--border-soft);}
.progress-top .seg.done{background:linear-gradient(90deg,var(--violet),var(--cyan));}

/* ---------- Skill level rows ---------- */
.level-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 18px; margin-bottom:10px;}
.level-row .lr-left{display:flex; align-items:center; gap:12px;}
.level-row .lr-icon{font-size:22px;}
.level-row .lr-name{font-weight:600; font-size:14.5px;}
.level-pick{display:flex; gap:6px; flex-wrap:wrap;}
.level-pick button{padding:6px 12px; font-size:12px; border-radius:100px; border:1px solid var(--border); color:var(--text-dim);}
.level-pick button.sel{background:rgba(139,127,255,.18); border-color:var(--violet); color:#fff;}

/* ---------- Profile ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:30px;}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:520px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{padding:18px; text-align:center;}
.stat-card .num{font-family:var(--font-mono); font-size:26px; font-weight:700; background:linear-gradient(135deg,var(--violet),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.stat-card .lbl{font-size:11.5px; color:var(--text-dim); margin-top:4px;}
.skill-list-item{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; margin-bottom:8px;}
.skill-list-item .l{display:flex; align-items:center; gap:12px; font-size:14.5px; font-weight:500;}
.badge-verified{font-size:11px; color:var(--success); font-family:var(--font-mono);}
.badge-unverified{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); cursor:pointer;}
.badge-unverified:hover{color:var(--violet);}

/* ---------- Profile Verification ---------- */
.shield-pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; font-family:var(--font-mono); padding:5px 11px; border-radius:100px; background:rgba(76,224,210,.14); color:var(--cyan); box-shadow:inset 0 0 0 1px rgba(76,224,210,.35);}
.shield-pill.lg{font-size:13.5px; padding:7px 14px;}
.badge-evidence{font-size:11px; color:var(--cyan); font-family:var(--font-mono);}
.verify-hero{padding:26px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.verify-hero .ic{font-size:34px;}
.status-pill{display:inline-block; font-size:11.5px; font-weight:700; font-family:var(--font-mono); padding:5px 12px; border-radius:100px; letter-spacing:.03em;}
.status-pill.st-not{background:var(--border-soft); color:var(--text-faint);}
.status-pill.st-pending{background:rgba(255,184,77,.14); color:var(--amber);}
.status-pill.st-review{background:rgba(139,127,255,.14); color:var(--violet);}
.status-pill.st-verified{background:rgba(76,224,210,.14); color:var(--cyan);}
.status-pill.st-rejected{background:rgba(255,107,122,.14); color:var(--danger);}
.status-pill.st-info{background:rgba(255,184,77,.14); color:var(--amber);}
.status-pill.st-failed{background:rgba(255,107,122,.1); color:var(--text-faint);}
.stepper-dots{display:flex; gap:8px; justify-content:center; margin-bottom:22px;}
.stepper-dots .dot{width:8px; height:8px; border-radius:50%; background:var(--border);}
.stepper-dots .dot.active{background:var(--violet); box-shadow:0 0 10px rgba(139,127,255,.6);}
.stepper-dots .dot.done{background:var(--cyan);}
.verif-type-opt{padding:16px 18px; border-radius:14px; border:1px solid var(--border); margin-bottom:10px; cursor:pointer; display:flex; align-items:center; gap:12px;}
.verif-type-opt:hover{border-color:rgba(139,127,255,.4);}
.verif-type-opt.selected{border-color:var(--violet); background:rgba(139,127,255,.08); box-shadow:0 0 0 1px rgba(139,127,255,.3);}
.dropzone{border:1.5px dashed var(--border); border-radius:16px; padding:30px 18px; text-align:center; cursor:pointer; transition:.2s;}
.dropzone:hover{border-color:var(--violet); background:rgba(139,127,255,.05);}
.file-chip{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; border:1px solid var(--border); border-radius:11px; margin-bottom:8px; font-size:13px;}
.file-chip .fn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.file-chip .rm{color:var(--danger); cursor:pointer; font-size:12px; flex-shrink:0;}
.ai-report-box{border:1px solid var(--border); border-radius:16px; padding:18px 20px; background:var(--bg-elev2);}
.ai-report-row{display:flex; align-items:flex-start; gap:10px; font-size:13.5px; padding:7px 0; border-bottom:1px solid var(--border-soft);}
.ai-report-row:last-child{border-bottom:none;}
.risk-meter{height:7px; border-radius:100px; background:var(--border-soft); overflow:hidden; margin:6px 0 4px;}
.risk-meter-fill{height:100%; border-radius:100px;}
.ai-disclaimer{font-size:11.5px; color:var(--text-faint); background:var(--border-soft); border-radius:10px; padding:10px 12px; margin-top:12px; line-height:1.5;}
.admin-queue-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 18px; margin-bottom:10px; flex-wrap:wrap;}
.timeline-item{display:flex; gap:12px; padding:9px 0; font-size:13px;}
.timeline-item .dot{width:8px; height:8px; border-radius:50%; background:var(--violet); margin-top:5px; flex-shrink:0;}
.timeline-item .meta{color:var(--text-faint); font-size:11.5px;}
.level-tag{font-size:11.5px; padding:3px 10px; border-radius:100px; background:var(--border-soft); border:1px solid var(--border); color:var(--text-dim);}

/* ---------- Match / buddy cards ---------- */
.match-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px;}
@media(max-width:820px){.match-grid{grid-template-columns:1fr;}}
.match-card{padding:20px;}
.mc-top{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
.mc-top .nm{font-weight:700; font-size:15.5px;}
.mc-top .score-pill{margin-left:auto; font-family:var(--font-mono); font-size:12.5px; font-weight:700; padding:5px 11px; border-radius:100px; background:rgba(255,184,77,.15); color:var(--amber); border:1px solid rgba(255,184,77,.35);}
.mc-row{font-size:13px; color:var(--text-dim); margin-bottom:6px; display:flex; gap:6px; align-items:center;}
.mc-row b{color:var(--text); font-weight:600;}
.mc-actions{display:flex; gap:10px; margin-top:16px;}

/* ---------- Community ---------- */
.post-card{padding:20px; margin-bottom:14px;}
.post-head{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.post-head .nm{font-weight:700; font-size:14.5px;}
.post-head .lvl{font-size:11.5px; color:var(--text-faint);}
.post-msg{font-size:14px; color:var(--text-dim); line-height:1.55; margin-bottom:14px;}
.post-skills{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.post-skills .ps{font-size:12.5px; padding:5px 12px; border-radius:100px; background:var(--border-soft); border:1px solid var(--border);}

/* ---------- Sessions ---------- */
.exchange-card{padding:22px; margin-bottom:20px;}
.exchange-title{font-weight:700; font-size:16px; margin-bottom:16px; display:flex; align-items:center; gap:10px;}
.path-list{display:flex; flex-direction:column; gap:8px; margin:14px 0 18px;}
.path-item{display:flex; align-items:center; gap:10px; font-size:13.5px; padding:9px 12px; border-radius:10px; background:var(--border-soft);}
.path-item .st{width:20px; text-align:center;}
.path-item.locked{color:var(--text-faint);}
.path-item.current{color:var(--violet); background:rgba(139,127,255,.1); border:1px solid rgba(139,127,255,.3);}
.today-box{background:rgba(76,224,210,.06); border:1px solid rgba(76,224,210,.25); border-radius:14px; padding:16px; margin-top:10px;}
.today-box .lbl{font-size:11px; color:var(--cyan); font-family:var(--font-mono); margin-bottom:8px; text-transform:uppercase; letter-spacing:.08em;}

/* ---------- Empty state ---------- */
.empty-state{text-align:center; padding:60px 24px;}
.empty-state .ic{font-size:38px; margin-bottom:14px;}
.empty-state h3{font-size:17px; margin-bottom:8px;}
.empty-state p{color:var(--text-dim); font-size:14px; margin-bottom:20px;}

/* ---------- Karma Points ---------- */
.karma-card{padding:28px 24px; text-align:center; position:relative; overflow:hidden;}
.karma-card::before{content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 0%, rgba(255,184,77,.12), transparent 65%); pointer-events:none;}
.karma-coin{width:64px; height:64px; margin:0 auto 12px; position:relative;}
.karma-coin svg{width:100%; height:100%; filter:drop-shadow(0 6px 18px rgba(255,184,77,.4));}
.karma-num{font-family:var(--font-mono); font-weight:800; font-size:40px; line-height:1; background:linear-gradient(135deg,#FFD98A,var(--amber)); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:4px; transition:.2s;}
.karma-num.bump{animation:karmaBump .5s ease;}
@keyframes karmaBump{0%{transform:scale(1);} 35%{transform:scale(1.18);} 100%{transform:scale(1);}}
.karma-label{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim); font-weight:700; font-family:var(--font-mono); margin-bottom:10px;}
.karma-tagline{font-size:13px; color:var(--text-dim); font-style:italic;}
.karma-badge-pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 12px; border-radius:100px; background:rgba(255,184,77,.14); border:1px solid rgba(255,184,77,.35); color:var(--amber); margin-top:12px;}
.karma-info-ic{display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:var(--border-soft); border:1px solid var(--border); color:var(--text-dim); font-size:10.5px; font-weight:700; cursor:help; position:relative; margin-left:6px; vertical-align:middle;}
.karma-info-ic .tip{display:none; position:absolute; bottom:130%; left:50%; transform:translateX(-50%); width:220px; background:var(--bg-elev2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:11.5px; line-height:1.5; color:var(--text-dim); box-shadow:0 12px 30px rgba(0,0,0,.5); z-index:20; font-weight:400; white-space:normal; text-transform:none; letter-spacing:normal;}
.karma-info-ic:hover .tip, .karma-info-ic:focus .tip, .karma-info-ic.tap .tip{display:block;}
.karma-pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:100px; background:rgba(255,184,77,.12); border:1px solid rgba(255,184,77,.3); color:var(--amber); white-space:nowrap;}
.karma-pill.sm{font-size:10.5px; padding:3px 8px;}
.karma-navpill{display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:100px; background:rgba(255,184,77,.1); border:1px solid rgba(255,184,77,.28); color:var(--amber); cursor:pointer; transition:.2s;}
.karma-navpill:hover{background:rgba(255,184,77,.18);}
.karma-copy-card{padding:16px 20px; font-size:13px; color:var(--text-dim); line-height:1.6; margin-top:16px; margin-bottom:26px;}
.karma-copy-card b{color:var(--text);}
.karma-history-item{display:flex; align-items:center; gap:14px; padding:14px 16px;}
.karma-history-item + .karma-history-item{margin-top:8px;}
.karma-hist-amt{font-family:var(--font-mono); font-weight:800; font-size:16px; width:44px; flex-shrink:0; text-align:center; border-radius:10px; padding:6px 0;}
.karma-hist-amt.earned{color:var(--success); background:rgba(95,227,161,.1);}
.karma-hist-amt.spent{color:var(--danger); background:rgba(255,107,122,.1);}
.karma-hist-body{flex:1; min-width:0;}
.karma-hist-desc{font-size:13.5px; font-weight:600;}
.karma-hist-meta{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
.karma-stat-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px;}
@media(max-width:820px){.karma-stat-grid{grid-template-columns:repeat(2,1fr);}}
.karma-toast-box{display:flex; align-items:center; gap:10px;}
.karma-insufficient-card{padding:22px; text-align:center;}
.karma-insufficient-card .ic{font-size:34px; margin-bottom:10px;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(5,6,12,.72); backdrop-filter:blur(4px); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal-box{width:100%; max-width:460px; max-height:90vh; max-height:90dvh; overflow-y:auto; background:var(--bg-elev2); border:1px solid var(--border); border-radius:20px; padding:26px; box-shadow:0 30px 80px rgba(0,0,0,.6); animation:popIn .25s cubic-bezier(.2,.9,.3,1.3);}
@keyframes popIn{from{transform:scale(.94) translateY(8px); opacity:0;} to{transform:scale(1) translateY(0); opacity:1;}}
.modal-box h3{font-size:18px; margin-bottom:16px;}
.modal-close{position:absolute;}
.qz-opt{padding:12px 14px; border-radius:11px; border:1px solid var(--border); margin-bottom:9px; font-size:14px; cursor:pointer;}
.qz-opt:hover{border-color:var(--violet);}

/* ---------- Toast ---------- */
#toast-root{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:300; display:flex; flex-direction:column; gap:10px; align-items:center;}
.toast{background:var(--bg-elev2); border:1px solid rgba(139,127,255,.4); padding:13px 22px; border-radius:100px; font-size:13.5px; font-weight:600; box-shadow:0 12px 30px rgba(0,0,0,.5); animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Feedback tags ---------- */
.star-picker{display:flex; gap:6px; font-size:28px; margin-bottom:6px;}
.star-picker span{cursor:pointer; filter:grayscale(1) opacity(.4); transition:.15s;}
.star-picker span.on{filter:none; opacity:1;}

/* ---------- Thank you ---------- */
.thankyou{text-align:center; padding:110px 24px 90px;}
.thankyou .big{font-size:clamp(38px,7vw,64px); font-weight:800; margin-bottom:18px;}
.thankyou p{color:var(--text-dim); max-width:520px; margin:0 auto 10px; font-size:16px; line-height:1.6;}
.thankyou .spark{font-size:16px; color:var(--cyan); margin:22px 0 34px; font-weight:600;}

/* ---------- misc ---------- */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:700px){.grid2{grid-template-columns:1fr;}}
.center{text-align:center;}
.fade-up{animation:fadeUp .5s ease both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
.section-title-sm{font-size:15px; font-weight:700; margin-bottom:14px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; font-family:var(--font-mono);}
hr.soft{border:none; border-top:1px solid var(--border-soft); margin:26px 0;}

/* ---------- Light theme ---------- */
html[data-theme="light"]{
  --bg:#F3F4FA; --bg-elev:#FFFFFF; --bg-elev2:#FFFFFF;
  --text:#14151F; --text-dim:#54566B; --text-faint:#8A8CA3;
  --border:rgba(20,21,31,.11); --border-soft:rgba(20,21,31,.05);
}
html[data-theme="light"] body::before{
  background-image:
    radial-gradient(circle at 15% 10%, rgba(139,127,255,.10), transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(76,224,210,.08), transparent 40%),
    radial-gradient(circle at 50% 90%, rgba(139,127,255,.06), transparent 45%),
    linear-gradient(rgba(20,21,31,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(20,21,31,.03) 1px, transparent 1px);
}
html[data-theme="light"] .card{background:linear-gradient(180deg, rgba(20,21,31,.03), rgba(20,21,31,.008));}
html[data-theme="light"] .topnav{background:rgba(243,244,250,.78);}
html[data-theme="light"] .bottomnav{background:rgba(255,255,255,.9);}
html[data-theme="light"] .field input, html[data-theme="light"] .field textarea, html[data-theme="light"] .field select{background:rgba(20,21,31,.03);}
html[data-theme="light"] .google-btn{border-color:var(--border);}

/* =========================================================
   THEME: COQUETTE — blush/cream/maroon/gold, romantic & soft
   ========================================================= */
html[data-theme="coquette"]{
  --bg:#FBF0EC; --bg-elev:#FFFFFF; --bg-elev2:#FDF3EF;
  --violet:#C0546A; --violet-dim:#9C3F52; --violet2:#8B3A4A; --cyan:#C99A44; --cyan2:#A87C33; --amber:#E3B15B;
  --text:#3B2226; --text-dim:#7C5058; --text-faint:#B98F94;
  --border:rgba(139,58,74,.16); --border-soft:rgba(139,58,74,.07);
  --danger:#C13B52; --success:#7FA170;
  --radius:22px; --radius-sm:16px;
  --glow-violet: 0 10px 28px rgba(192,84,106,.22);
  --glow-cyan: 0 10px 28px rgba(201,154,68,.2);
  --on-accent:#FFF8F3;
  --card-shadow: 0 12px 30px rgba(139,58,74,.12);
  --font-display:'Playfair Display',serif; --font-body:'Poppins',sans-serif; --font-mono:'Poppins',sans-serif;
  --heading-tracking:0; --card-clip:none;
}
html[data-theme="coquette"] body::before{
  background-image:
    radial-gradient(circle at 12% 8%, rgba(192,84,106,.14), transparent 42%),
    radial-gradient(circle at 88% 25%, rgba(227,177,91,.14), transparent 42%),
    radial-gradient(circle at 50% 92%, rgba(192,84,106,.08), transparent 45%);
  background-size:auto,auto,auto;
}
html[data-theme="coquette"] .card{background:linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,.35)); box-shadow:0 8px 22px rgba(139,58,74,.08);}
html[data-theme="coquette"] .card-hover:hover{box-shadow:var(--card-shadow); border-color:rgba(192,84,106,.35);}
html[data-theme="coquette"] .topnav{background:rgba(251,240,236,.82);}
html[data-theme="coquette"] .bottomnav{background:rgba(255,255,255,.92);}
html[data-theme="coquette"] .field input, html[data-theme="coquette"] .field textarea, html[data-theme="coquette"] .field select{background:rgba(139,58,74,.03);}
html[data-theme="coquette"] .google-btn{border-color:var(--border);}
html[data-theme="coquette"] .btn-primary, html[data-theme="coquette"] .btn-cyan{box-shadow:0 8px 20px rgba(139,58,74,.22);}
html[data-theme="coquette"] .sb-line::after{box-shadow:0 0 10px 2px rgba(192,84,106,.6);}

/* Landing boxes (.step-card / .why-card) → translucent ribbon/bow panels.
   The shape lives on ::before (behind the real content, z-index:-1) so
   the clip-path notches never touch the actual text/icons. */
html[data-theme="coquette"] .step-card,
html[data-theme="coquette"] .why-card{
  position:relative; z-index:0;
  background:transparent; border:none; box-shadow:none;
  padding-left:32px; padding-right:32px;
}
html[data-theme="coquette"] .step-card::before,
html[data-theme="coquette"] .why-card::before{
  content:''; position:absolute; inset:0; z-index:-1;
  clip-path:polygon(0 0,100% 0,100% 38%,93% 50%,100% 62%,100% 100%,0 100%,0 62%,7% 50%,0 38%);
  background:
    linear-gradient(135deg, rgba(255,255,255,.62) 0%, transparent 34%),
    linear-gradient(205deg, rgba(255,255,255,.16) 0%, transparent 42%),
    linear-gradient(180deg, rgba(255,255,255,.68), rgba(253,239,234,.4));
  border:1px solid rgba(192,84,106,.3);
  box-shadow:0 10px 26px rgba(139,58,74,.12);
}
html[data-theme="coquette"] .step-card::after,
html[data-theme="coquette"] .why-card::after{
  content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
  width:30px; height:15px; z-index:1; pointer-events:none;
  background:
    radial-gradient(circle at 26% 58%, var(--violet2) 0 6px, transparent 7px),
    radial-gradient(circle at 74% 58%, var(--violet2) 0 6px, transparent 7px),
    linear-gradient(90deg, transparent 42%, var(--cyan) 42%, var(--cyan) 58%, transparent 58%);
  opacity:.9;
}

/* =========================================================
   THEME: KAWAII — pastel lavender/mint/pink/sky, cute & bouncy

html[data-theme="kawaii"]{

  --violet:#B39DDB; --violet-dim:#9884C4; --violet2:#F48FB1; --cyan:#7FD8E8; --cyan2:#93E3B8; --amber:#FFDA6B;

  --radius:28px; --radius-sm:20px;
  --glow-violet: 0 0 22px rgba(179,157,219,.4);
  --glow-cyan: 0 0 22px rgba(127,216,232,.35);
  --on-accent:#3D2B4F;
  --card-shadow: 0 14px 30px rgba(179,157,219,.28);

  --heading-tracking:0; --card-clip:none;

html[data-theme="kawaii"] body::before{

}
html[data-theme="kawaii"] .card{background:rgba(255,255,255,.75); border-width:2px; box-shadow:0 6px 18px rgba(179,157,219,.14);}
html[data-theme="kawaii"] .card-hover{transition:.2s cubic-bezier(.34,1.56,.64,1);}
html[data-theme="kawaii"] .card-hover:hover{transform:translateY(-4px) scale(1.015); box-shadow:var(--card-shadow); border-color:rgba(179,157,219,.5);}
html[data-theme="kawaii"] .topnav{background:rgba(255,251,254,.85);}
html[data-theme="kawaii"] .bottomnav{background:rgba(255,255,255,.94);}
html[data-theme="kawaii"] .field input, html[data-theme="kawaii"] .field textarea, html[data-theme="kawaii"] .field select{background:rgba(179,157,219,.05); border-width:2px;}
html[data-theme="kawaii"] .google-btn{border-color:var(--border);}
html[data-theme="kawaii"] .btn{transition:.2s cubic-bezier(.34,1.56,.64,1);}
html[data-theme="kawaii"] .btn:hover{transform:translateY(-2px) scale(1.04);}
html[data-theme="kawaii"] .btn-primary, html[data-theme="kawaii"] .btn-cyan{box-shadow:0 6px 16px rgba(179,157,219,.3), inset 0 0 0 2px rgba(255,255,255,.6);}
html[data-theme="kawaii"] .chip{border-width:2px;}

/* Landing boxes (.step-card / .why-card) → cute animal-head silhouettes.
   Shape + ears + face dots live on ::before/::after behind the real
   content (z-index:-1) so text/icons are never clipped. */
html[data-theme="kawaii"] .step-card,
html[data-theme="kawaii"] .why-card{
  position:relative; z-index:0;
  background:transparent; border:none; box-shadow:none;
  padding-top:30px;
}
html[data-theme="kawaii"] .step-card::before,
html[data-theme="kawaii"] .why-card::before{
  content:''; position:absolute; inset:6px 0 0 0; z-index:-1;
  border-radius:46% 46% 42% 42% / 58% 58% 40% 40%;
  background:rgba(255,255,255,.78);
  border:2px solid rgba(179,157,219,.45);
  box-shadow:0 8px 20px rgba(179,157,219,.22);
}
html[data-theme="kawaii"] .step-card::after,
html[data-theme="kawaii"] .why-card::after{
  content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(circle at 20% 9%, rgba(255,255,255,.9) 0 13px, rgba(179,157,219,.5) 13px 15px, transparent 16px),
    radial-gradient(circle at 80% 9%, rgba(255,255,255,.9) 0 13px, rgba(179,157,219,.5) 13px 15px, transparent 16px),
    radial-gradient(circle at 50% 95%, rgba(70,58,87,.5) 0 2.5px, transparent 3px),
    radial-gradient(circle at 43% 91%, rgba(70,58,87,.32) 0 1.4px, transparent 2px),
    radial-gradient(circle at 57% 91%, rgba(70,58,87,.32) 0 1.4px, transparent 2px);
}

/* =========================================================

html[data-theme="sketch"]{
  --bg:#F6F2E9; --bg-elev:#FDFBF6; --bg-elev2:#F0E9DA;
  --violet:#C1673F; --violet-dim:#A0522F; --violet2:#A8532E; --cyan:#7C9473; --cyan2:#5F7757; --amber:#D4A24C;
  --text:#2B2723; --text-dim:#665C4F; --text-faint:#9C9184;

  --glow-violet: 0 3px 0 rgba(43,39,35,.12), 0 6px 14px rgba(43,39,35,.1);

html[data-theme="sketch"] h1,html[data-theme="sketch"] h2,html[data-theme="sketch"] h3,html[data-theme="sketch"] .display{font-weight:700;}

}
html[data-theme="sketch"] .card-hover:hover{transform:translate(-2px,-3px); box-shadow:5px 8px 0 rgba(43,39,35,.16);}
html[data-theme="sketch"] .topnav{background:rgba(246,242,233,.88); border-bottom:1.5px solid var(--text);}

html[data-theme="sketch"] .field input, html[data-theme="sketch"] .field textarea, html[data-theme="sketch"] .field select{background:rgba(43,39,35,.02); border:1.5px solid var(--text); border-radius:8px 12px 8px 12px;}

html[data-theme="sketch"] .btn{border-radius:100px 6px 100px 6px/6px 100px 6px 100px;}

/* =========================================================
   THEME: SCI-FI TECHY — neon HUD / cyberpunk dashboard
   ========================================================= */
html[data-theme="scifi"]{
  --bg:#050810; --bg-elev:#0A0F1C; --bg-elev2:#0F1526;
  --violet:#B026FF; --violet-dim:#7E1BC2; --violet2:#FF2E9E; --cyan:#00E5FF; --cyan2:#00B8D4; --amber:#FFC400;
  --text:#E8FBFF; --text-dim:#82AAB8; --text-faint:#4A6572;
  --border:rgba(0,229,255,.28); --border-soft:rgba(0,229,255,.1);
  --danger:#FF3D57; --success:#00FFA3;
  --radius:3px; --radius-sm:2px;
  --glow-violet: 0 0 30px rgba(176,38,255,.5);
  --glow-cyan: 0 0 30px rgba(0,229,255,.45);
  --on-accent:#050810;
  --card-shadow: 0 0 24px rgba(0,229,255,.18);
  --font-display:'Orbitron',sans-serif; --font-body:'Rajdhani',sans-serif; --font-mono:'JetBrains Mono',monospace;
  --heading-tracking:.04em; --card-clip:polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
}
html[data-theme="scifi"] body{letter-spacing:.01em;}
html[data-theme="scifi"] body::before{
  /* Grid/square pattern replaced with scanlines + a faint star field. */
  background-image:
    radial-gradient(circle at 15% 10%, rgba(176,38,255,.18), transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(0,229,255,.16), transparent 40%),
    radial-gradient(circle at 50% 90%, rgba(176,38,255,.1), transparent 45%),
    repeating-linear-gradient(0deg, rgba(0,229,255,.045) 0px, rgba(0,229,255,.045) 1px, transparent 1px, transparent 4px),
    radial-gradient(1.5px 1.5px at 40px 60px, rgba(232,251,255,.55), transparent 60%),
    radial-gradient(1px 1px at 140px 20px, rgba(0,229,255,.5), transparent 60%),
    radial-gradient(1.5px 1.5px at 90px 150px, rgba(176,38,255,.45), transparent 60%),
    radial-gradient(1px 1px at 190px 110px, rgba(232,251,255,.4), transparent 60%),
    radial-gradient(1px 1px at 20px 180px, rgba(0,229,255,.35), transparent 60%);
  background-repeat:no-repeat,no-repeat,no-repeat,repeat,repeat,repeat,repeat,repeat,repeat;
  background-size:auto,auto,auto,100% 4px,220px 200px,220px 200px,220px 200px,220px 200px,220px 200px;
}
html[data-theme="scifi"] h1,html[data-theme="scifi"] h2,html[data-theme="scifi"] h3,html[data-theme="scifi"] .display{text-transform:uppercase;}
html[data-theme="scifi"] .card{clip-path:var(--card-clip); border-color:rgba(0,229,255,.3); box-shadow:inset 0 0 0 1px rgba(0,229,255,.08);}
html[data-theme="scifi"] .card-hover:hover{border-color:rgba(0,229,255,.6); box-shadow:var(--card-shadow), inset 0 0 0 1px rgba(0,229,255,.15);}
html[data-theme="scifi"] .topnav{background:rgba(5,8,16,.82); border-bottom:1px solid rgba(0,229,255,.25);}
html[data-theme="scifi"] .bottomnav{background:rgba(10,15,28,.92); border-top:1px solid rgba(0,229,255,.25);}
html[data-theme="scifi"] .field input, html[data-theme="scifi"] .field textarea, html[data-theme="scifi"] .field select{background:rgba(0,229,255,.03); border-radius:2px;}
html[data-theme="scifi"] .google-btn{border-color:var(--border);}
html[data-theme="scifi"] .btn{border-radius:2px; clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); text-transform:uppercase; letter-spacing:.06em;}
html[data-theme="scifi"] .btn-primary{box-shadow:0 0 20px rgba(176,38,255,.4);}
html[data-theme="scifi"] .btn-cyan{box-shadow:0 0 20px rgba(0,229,255,.4);}
html[data-theme="scifi"] .chip{border-radius:2px;}
html[data-theme="scifi"] .avatar, html[data-theme="scifi"] .avatar img, html[data-theme="scifi"] .avatar-option img{border-radius:3px;}
html[data-theme="scifi"] .sb-line::after{box-shadow:0 0 14px 3px var(--cyan); background:var(--cyan);}

/* Landing boxes (.step-card / .why-card) → hexagonal holographic panels.
   Fixed-px corner cuts (not %) keep the pinch modest so text/icons never
   get clipped; extra side padding gives the tips clear space. */
html[data-theme="scifi"] .step-card,
html[data-theme="scifi"] .why-card{
  position:relative; overflow:hidden;
  clip-path:polygon(20px 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 20px 100%, 0 50%);
  background:linear-gradient(180deg, rgba(0,229,255,.07), rgba(176,38,255,.05));
  border:1px solid rgba(0,229,255,.35);
  box-shadow:inset 0 0 0 1px rgba(0,229,255,.1), 0 0 24px rgba(0,229,255,.08);
  padding-left:34px; padding-right:34px;
}
html[data-theme="scifi"] .step-card::before,
html[data-theme="scifi"] .why-card::before{
  content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,229,255,.05) 0px, rgba(0,229,255,.05) 1px, transparent 1px, transparent 3px);
  mix-blend-mode:screen;
  animation:scifiCardFlicker 4.5s ease-in-out infinite;
}
html[data-theme="scifi"] .step-card::after,
html[data-theme="scifi"] .why-card::after{
  content:''; position:absolute; top:0; left:20px; right:20px; height:1px; z-index:1; pointer-events:none;
  background:linear-gradient(90deg, transparent, var(--cyan), transparent);
  box-shadow:0 0 8px 1px rgba(0,229,255,.6);
}
@keyframes scifiCardFlicker{0%,100%{opacity:.55;} 50%{opacity:1;} 52%{opacity:.32;} 54%{opacity:1;}}

/* ---------- Font scale ---------- */
#app{zoom:var(--font-zoom,1);}
@supports not (zoom:1){ #app{transform:scale(var(--font-zoom,1)); transform-origin:top center;} }

/* ---------- Reduced motion ---------- */
html.reduced-motion *{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important;}
html.reduced-motion .sb-line::after{display:none;}
html.reduced-motion .card-hover:hover{transform:none;}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="splash-root"></div>

<script>
/* =========================================================
   SKILL SYNC — prototype SPA (vanilla JS, localStorage)
   ========================================================= */

/* ---------- Master skill list ---------- */
const SKILLS_MASTER = [
  {name:'Python', icon:'🐍'}, {name:'C++', icon:'⚙️'}, {name:'Web Development', icon:'🌐'},
  {name:'Guitar', icon:'🎸'}, {name:'Drawing', icon:'🎨'}, {name:'Photography', icon:'📸'},
  {name:'Mathematics', icon:'➗'}, {name:'Public Speaking', icon:'🎤'}, {name:'Cooking', icon:'🍳'},
  {name:'Video Editing', icon:'🎬'}, {name:'Crafting', icon:'✂️'}, {name:'Dance', icon:'💃'},
  {name:'Singing', icon:'🎙️'}, {name:'Content Creation', icon:'📱'}
];
function iconFor(name){
  const m = SKILLS_MASTER.find(s=>s.name.toLowerCase()===String(name).toLowerCase());
  return m ? m.icon : '🧩';
}
const LEVELS_TEACH = ['Beginner','Intermediate','Advanced','Expert'];
const LEVELS_LEARN = ['Beginner','Intermediate','Advanced'];
const FEEDBACK_TAGS = ['Helpful','Friendly','Patient','Knowledgeable','Good Teacher','Good Learner','Easy to communicate with'];

/* ---------- Master interest list (Find Buddy interest-aware discovery) ----------
   Small, separate master list from SKILLS_MASTER — interests are personal hobbies,
   distinct from teach/learn skills. The Interest filter dropdown always shows the
   union of this list + any interest already present on a user record, so a filter
   never hides an interest just because it isn't in this curated set. */
const INTERESTS_MASTER = [
  {name:'Coding', icon:'💻'}, {name:'Gaming', icon:'🎮'}, {name:'Music', icon:'🎵'},
  {name:'Photography', icon:'📸'}, {name:'Painting', icon:'🎨'}, {name:'Football', icon:'⚽'},
  {name:'Reading', icon:'📚'}, {name:'Travel', icon:'✈️'}, {name:'Movies', icon:'🎬'},
  {name:'Fitness', icon:'💪'}, {name:'Anime', icon:'🌸'}
];
function interestIconFor(name){
  const m = INTERESTS_MASTER.find(s=>s.name.toLowerCase()===String(name||'').trim().toLowerCase());
  return m ? m.icon : '💜';
}
/* All interests available to filter by: the curated master list plus any
   custom interest already stored on a user, deduped case-insensitively. */
function allInterestNames(){
  const seen = new Map();
  INTERESTS_MASTER.forEach(i=> seen.set(i.name.toLowerCase(), i.name));
  Object.values(P.users).forEach(u=>{
    (u.interests||[]).forEach(raw=>{
      const norm = String(raw||'').trim().toLowerCase();
      if(norm && !seen.has(norm)) seen.set(norm, String(raw).trim());
    });
  });
  return Array.from(seen.values()).sort((a,b)=>a.localeCompare(b));
}
/* Interests a user shares with `a`, case-insensitive, deduped, returned using
   a's original casing. Missing/empty/non-array interests never throw. */
function sharedInterestsList(a,b){
  const aList = Array.isArray(a && a.interests) ? a.interests : [];
  const bList = Array.isArray(b && b.interests) ? b.interests : [];
  const bSet = new Set(bList.map(x=>String(x||'').trim().toLowerCase()).filter(Boolean));
  const seen = new Set(), out = [];
  aList.forEach(x=>{
    const norm = String(x||'').trim().toLowerCase();
    if(norm && bSet.has(norm) && !seen.has(norm)){ seen.add(norm); out.push(String(x).trim()); }
  });
  return out;
}
function interestMatchData(a,b){
  const shared = sharedInterestsList(a,b);
  const aCount = Array.isArray(a && a.interests)
    ? new Set(a.interests.map(x=>String(x||'').trim().toLowerCase()).filter(Boolean)).size : 0;
  const interestScore = aCount>0 ? Math.round((shared.length/aCount)*100) : 0;
  return { sharedInterests: shared, sharedCount: shared.length, interestScore };
}
function userHasInterest(u, name){
  const norm = String(name||'').trim().toLowerCase();
  if(!norm) return true;
  return (u.interests||[]).some(x=> String(x||'').trim().toLowerCase()===norm);
}
function toggleMyInterest(name){
  const u = me(); if(!u) return;
  if(!Array.isArray(u.interests)) u.interests = [];
  const norm = String(name).trim().toLowerCase();
  const idx = u.interests.findIndex(x=> String(x).trim().toLowerCase()===norm);
  if(idx>-1) u.interests.splice(idx,1); else u.interests.push(name);
  save(); render();
}

/* ---------- Persistence ---------- */
const STORE_KEY = 'skillsync_state_v1';
function freshPersisted(){
  return { currentUserId:null, users:{}, requests:[], community: seedCommunity(), feedbacks:[], karmaTransactions:[], verifications:[],
    sessions: seedSessions(), availability: seedAvailability(), sessionFeedbacks:[],
    interactiveCourses: seedInteractiveCourses(), interactiveProgress:{} };
}
function loadPersisted(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return freshPersisted();
    const parsed = JSON.parse(raw);
    if(!parsed.community || !parsed.community.length) parsed.community = seedCommunity();
    if(!parsed.karmaTransactions) parsed.karmaTransactions = [];
    if(!parsed.verifications) parsed.verifications = [];
    if(!parsed.sessions || !parsed.sessions.length) parsed.sessions = seedSessions();
    if(!parsed.availability || !parsed.availability.length) parsed.availability = seedAvailability();
    if(!parsed.sessionFeedbacks) parsed.sessionFeedbacks = [];
    if(!parsed.interactiveCourses || !parsed.interactiveCourses.length) parsed.interactiveCourses = seedInteractiveCourses();
    if(!parsed.interactiveProgress) parsed.interactiveProgress = {};
    return parsed;
  }catch(e){ return freshPersisted(); }
}

/* =========================================================
   CALENDAR / SESSIONS — data model + date helpers
   ---------------------------------------------------------
   Session: {id, title, teacher:{id,name,skill}, learner:{id,name,skill},
             date:'YYYY-MM-DD', startTime:'HH:MM', endTime:'HH:MM',
             duration, status: upcoming|pending|completed|cancelled, type:'skill_exchange'}
   Availability slot: {id, userId, skill, date, startTime, endTime, duration, status: available|booked}
   Kept as plain data now so it can be swapped for real API calls later —
   see services.sessionService / services.availabilityService below.
   ========================================================= */
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtDateISO(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function addDaysISO(iso, days){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+days); return fmtDateISO(d); }
function todayISO(){ return fmtDateISO(new Date()); }
function fmtTime12(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const period = h>=12?'PM':'AM'; let h12 = h%12; if(h12===0) h12=12;
  return `${h12}:${pad2(m)} ${period}`;
}
function fmtDateLong(iso){
  return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'});
}
function fmtDateShort(iso){
  return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}
function minutesBetween(dateISO, hhmm){
  const target = new Date(dateISO+'T'+hhmm+':00');
  return Math.round((target - new Date())/60000);
}
function seedSessions(){

/* ---------- Profile field validation / username helpers ----------
   Kept as small pure-ish functions (only usernameTaken reads P) so the
   Edit Profile form and the signup/migration paths above share one
   source of truth for what a "valid" username or email looks like. */
function normalizeUsername(raw){ return String(raw||'').trim().replace(/^@+/,''); }
function isValidUsernameFormat(u){ return /^[A-Za-z0-9_]{3,20}$/.test(u); }
function usernameTaken(u, excludeId){
  const norm = String(u||'').toLowerCase();
  return Object.values(P.users).some(x=> x.id!==excludeId && String(x.username||'').toLowerCase()===norm);
}
function isValidEmailFormat(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'')); }
function generateUsernameFromName(name, excludeId){
  let base = String(name||'user').toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'');
  if(base.length<3) base = (base+'user').slice(0,3);
  base = base.slice(0,16);
  let candidate = base, n=1;
  while(usernameTaken(candidate, excludeId)){ candidate = base.slice(0,16)+n; n++; }
  return candidate;
}

/* ---------- Security: output encoding ----------
   Every value below comes from user-entered fields (bio, messages,
   notes, custom skill names, etc.) and is interpolated into HTML
   template strings. Escaping here is what stands between a stored
   value and stored XSS, since this app renders via innerHTML rather
   than a framework that auto-escapes. Always run untrusted/user text
   through esc() (or escAttr() inside an HTML attribute) before
   interpolating it into a template string. */
function esc(str){
  if(str===null || str===undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function escAttr(str){ return esc(str); } // same rules are safe inside a quoted HTML attribute
/* Very small heuristic to warn users before they post contact info
   into fields other people will see (community posts, connection
   requests, bios). This is a UX nudge, not a hard block — it can't
   catch every obfuscation, and it never runs server-side because
   there is no server in this prototype (see SECURITY.md). */
function containsLikelyContactInfo(text){
  if(!text) return false;
  const emailRe = /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i;
  const phoneRe = /(\+?\d[\d\-\s().]{7,}\d)/;
  const urlRe = /\bhttps?:\/\/\S+/i;
  return emailRe.test(text) || phoneRe.test(text) || urlRe.test(text);
}

}

/* =========================================================
   SETTINGS SYSTEM
   ========================================================= */
const SETTINGS_KEY = 'skillsync_settings_v1';
function defaultSettings(){
  return {
    language:'en', theme:'dark', fontSize:'medium',
    reducedMotion: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches,
    compactMode:false,
    notifications:{ connectionRequests:true, sessionReminders:true, communityActivity:true, skillRecommendations:true },
    privacy:{ profileVisibility:'members', showSkills:true, allowRequests:true, onlineStatus:true },
    accessibility:{ highContrast:false }
  };
}
function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    if(!raw) return defaultSettings();
    const d = defaultSettings();
    const parsed = JSON.parse(raw);
    return { ...d, ...parsed, notifications:{...d.notifications, ...(parsed.notifications||{})}, privacy:{...d.privacy, ...(parsed.privacy||{})}, accessibility:{...d.accessibility, ...(parsed.accessibility||{})} };
  }catch(e){ return defaultSettings(); }
}
let S = loadSettings();
function saveSettings(){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(S)); }
function updateSetting(path, value){
  const parts = path.split('.');
  let obj = S;
  for(let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
  obj[parts[parts.length-1]] = value;
  saveSettings();
  applySettings();
  render();
}
function resetSettings(){ S = defaultSettings(); saveSettings(); applySettings(); render(); toast(t('settings.toastReset')); }
function applySettings(){
  const html = document.documentElement;
  const body = document.body;
  html.setAttribute('data-theme', resolvedTheme());
  const zoomMap = {small:.9, medium:1, large:1.1, xlarge:1.2};
  html.style.setProperty('--font-zoom', zoomMap[S.fontSize]||1);
  html.classList.toggle('reduced-motion', !!S.reducedMotion);
  body.classList.toggle('compact-mode', !!S.compactMode);
  body.classList.toggle('high-contrast', !!S.accessibility.highContrast);
  html.lang = S.language;
}
function resolvedTheme(){
  if(S.theme==='system'){
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  return S.theme;
}
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(S.theme==='system') applySettings(); });
}

const THEMES = [
  {id:'dark', label:'Default', dot:'linear-gradient(135deg,#8B7FFF,#4CE0D2)'},
  {id:'light', label:'Light', dot:'linear-gradient(135deg,#F3F4FA,#8B7FFF)'},
  {id:'coquette', label:'Coquette', dot:'linear-gradient(135deg,#C0546A,#E3B15B)'},
  {id:'kawaii', label:'Kawaii', dot:'linear-gradient(135deg,#B39DDB,#F48FB1)'},
  {id:'sketch', label:'Sketch', dot:'linear-gradient(135deg,#C1673F,#7C9473)'},
  {id:'scifi', label:'Sci-Fi', dot:'linear-gradient(135deg,#B026FF,#00E5FF)'},
];
function setTheme(theme){
  S.theme = theme;
  saveSettings();
  applySettings();
  UI.themeMenuOpen = false;
  render();
  toast(t('settings.toastTheme'));
}
function themePickerHTML(){
  const active = resolvedTheme();
  return `
    <div class="theme-picker ${UI.themeMenuOpen?'open':''}">
      <div class="tp-title">Theme</div>
      <div class="tp-grid">
        ${THEMES.map(th=>`
          <div class="theme-swatch ${active===th.id?'active':''}" onclick="event.stopPropagation(); setTheme('${th.id}')" title="${th.label}">
            <div class="ts-dot" style="background:${th.dot};"></div>
            <div class="ts-label">${th.label}</div>
          </div>`).join('')}
      </div>
    </div>`;
}

/* ---------- Account modals ----------
   Edit Profile uses its own draft object (UI.editProfile) rather than
   mutating me() directly while the user types — see FORM STATE at the
   bottom of this comment block for why:
     Current User -> Draft Profile -> Save -> Validate -> Persist -> Source of Truth -> UI refresh
   Text inputs (name/username/email/bio/location) are read from the DOM
   only when something needs their value (save, a skill add/remove causing
   a re-render, or a navigation-away check) — never on every keystroke —
   so re-rendering the modal to add/remove a skill chip never steals focus
   out of whatever field the user is mid-typing in. */
function openEditProfileModal(){
  UI.userMenuOpen = false;
  const u = me();
  const snap = () => ({
    name: u.name||'', username: u.username||'', email: u.email||'',
    bio: u.bio||'', location: u.location||'',
    teach: (u.teach||[]).map(s=>({...s})), learn: (u.learn||[]).map(s=>({...s}))
  });
  const base = snap();
  UI.editProfile = { ...base, original: snap(), skillPicker:null, errors:{}, saving:false };
  renderEditProfileModal();
}
function epSyncFieldsFromDOM(){
  const d = UI.editProfile; if(!d) return;
  const g = id => document.getElementById(id);
  if(g('ep-name')) d.name = g('ep-name').value;
  if(g('ep-username')) d.username = g('ep-username').value;
  if(g('ep-email')) d.email = g('ep-email').value;
  if(g('ep-bio')) d.bio = g('ep-bio').value;
  if(g('ep-location')) d.location = g('ep-location').value;
}
function epHasChanges(){
  const d = UI.editProfile; if(!d) return false;
  const o = d.original;
  if((d.name||'')!==(o.name||'') || normalizeUsername(d.username)!==normalizeUsername(o.username) ||
     (d.email||'')!==(o.email||'') || (d.bio||'')!==(o.bio||'') || (d.location||'')!==(o.location||'')) return true;
  if(JSON.stringify(d.teach)!==JSON.stringify(o.teach)) return true;
  if(JSON.stringify(d.learn)!==JSON.stringify(o.learn)) return true;
  return false;
}
function epAttemptClose(afterAction){
  epSyncFieldsFromDOM();
  if(UI.editProfile && epHasChanges()){
    UI.editProfile._pendingAfter = afterAction;
    openModal(`
      <h3>Unsaved Changes</h3>
      <p style="font-size:14px; color:var(--text-dim); margin-bottom:20px;">You have unsaved changes. Are you sure you want to leave?</p>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-ghost btn-block" onclick="epKeepEditing()">Keep Editing</button>
        <button class="btn btn-danger-o btn-block" onclick="epDiscardChanges()">Discard Changes</button>
      </div>
    `);
  } else {
    UI.editProfile = null;
    afterAction();
  }
}
function epKeepEditing(){ renderEditProfileModal(); }
function epDiscardChanges(){
  const after = UI.editProfile && UI.editProfile._pendingAfter;
  UI.editProfile = null;
  if(after) after(); else closeModal();
}
function epOpenSkillPicker(kind){
  epSyncFieldsFromDOM();
  UI.editProfile.skillPicker = kind;
  UI.editProfile.errors.skillDup = null;
  renderEditProfileModal();
}
function epCloseSkillPicker(){
  epSyncFieldsFromDOM();
  UI.editProfile.skillPicker = null;
  renderEditProfileModal();
}
function epPickSkill(kind, skillName){
  epSyncFieldsFromDOM();
  const d = UI.editProfile;
  const otherKind = kind==='teach' ? 'learn' : 'teach';
  if(d[kind].some(s=>s.skill===skillName)){ d.skillPicker=null; renderEditProfileModal(); return; }
  if(d[otherKind].some(s=>s.skill===skillName)){
    d.errors.skillDup = kind==='teach'
      ? 'This skill is already in your learning list.'
      : 'This skill is already in your teaching list.';
    d.skillPicker = null;
    renderEditProfileModal();
    return;
  }
  d[kind].push({skill:skillName, level:'Beginner', goal: kind==='learn'?'Beginner':null, verified:false});
  d.errors.skillDup = null;
  d.skillPicker = null;
  renderEditProfileModal();
}
function epAddCustomSkill(kind){
  const inp = document.getElementById('ep-custom-skill-input');
  const val = (inp && inp.value || '').trim();
  if(!val) return;
  if(!SKILLS_MASTER.find(s=>s.name.toLowerCase()===val.toLowerCase())){
    SKILLS_MASTER.push({name: val, icon:'🧩'});
  }
  epPickSkill(kind, val);
}
function epFilterSkillChips(q){
  q = q.toLowerCase();
  document.querySelectorAll('#ep-skill-chip-list [data-skill]').forEach(el=>{
    const name = (el.getAttribute('data-skill')||'').toLowerCase();
    el.style.display = name.includes(q) ? '' : 'none';
  });
}
function epRemoveSkill(kind, skillName){
  epSyncFieldsFromDOM();

  d[kind] = d[kind].filter(s=>s.skill!==skillName);
  renderEditProfileModal();
}
function epSetSkillLevel(kind, skillName, level){
  epSyncFieldsFromDOM();
  const d = UI.editProfile;
  const item = d[kind].find(s=>s.skill===skillName);
  if(item) item.level = level;
  renderEditProfileModal();
}
function epCheckUsernameLive(){
  const d = UI.editProfile; if(!d) return;
  const raw = document.getElementById('ep-username').value;
  const norm = normalizeUsername(raw);
  const statusEl = document.getElementById('ep-username-status');
  if(!statusEl) return;
  if(norm === normalizeUsername(d.original.username)){
    statusEl.textContent = 'Your unique public identity on Skill Sync.';
    statusEl.style.color = 'var(--text-dim)';
    d.errors.username = null;
    return;
  }
  if(!isValidUsernameFormat(norm)){
    statusEl.textContent = 'Username must be 3–20 characters and contain only letters, numbers, or underscores.';
    statusEl.style.color = 'var(--danger)';
    d.errors.username = 'invalid';
    return;
  }
  if(usernameTaken(norm, P.currentUserId)){
    statusEl.textContent = 'This username is already taken.';
    statusEl.style.color = 'var(--danger)';
    d.errors.username = 'taken';
    return;
  }
  statusEl.textContent = '✓ Username available';
  statusEl.style.color = 'var(--success)';
  d.errors.username = null;
}
function epCheckEmailLive(){
  const d = UI.editProfile; if(!d) return;
  const raw = document.getElementById('ep-email').value.trim();
  const statusEl = document.getElementById('ep-email-status');
  if(!statusEl) return;
  if(!raw || !isValidEmailFormat(raw)){
    statusEl.textContent = 'Please enter a valid email address.';
    statusEl.style.color = 'var(--danger)';
    d.errors.email = 'invalid';
    return;
  }
  statusEl.textContent = raw===d.original.email
    ? 'This is your current email address.'
    : 'Changing your email will update the email associated with your Skill Sync account.';
  statusEl.style.color = 'var(--text-dim)';
  d.errors.email = null;
}

function epSave(){
  epSyncFieldsFromDOM();
  const d = UI.editProfile;
  const errors = {};
  const name = (d.name||'').trim();
  if(!name) errors.name = 'Please enter your full name.';

  const normUsername = normalizeUsername(d.username);
  const usernameChanged = normUsername !== normalizeUsername(d.original.username);
  if(!isValidUsernameFormat(normUsername)){
    errors.username = 'Username must be 3–20 characters and contain only letters, numbers, or underscores.';
  } else if(usernameChanged && usernameTaken(normUsername, P.currentUserId)){
    errors.username = 'This username is already taken.';
  }

  const email = (d.email||'').trim();
  if(!isValidEmailFormat(email)) errors.email = 'Please enter a valid email address.';

  if(Object.keys(errors).length){
    d.errors = {...d.errors, ...errors};
    toast(Object.values(errors)[0]);
    renderEditProfileModal();
    return;
  }

  if(!epHasChanges()){
    UI.editProfile = null;
    closeModal();
    return;
  }

  d.saving = true;
  renderEditProfileModal();
  setTimeout(()=>{
    try{
      const u = me();
      const skillsChanged = JSON.stringify(u.teach)!==JSON.stringify(d.teach) || JSON.stringify(u.learn)!==JSON.stringify(d.learn);
      u.name = esc(name);
      u.username = normUsername;
      u.email = email;
      u.bio = esc((d.bio||'').trim());
      u.location = esc((d.location||'').trim());
      u.teach = d.teach.map(s=>({...s}));
      u.learn = d.learn.map(s=>({...s}));
      save();
      if(skillsChanged) recordSkillActivity(u.id);
      UI.editProfile = null;
      closeModal();
      render();
      toast('✓ Profile updated successfully');
    }catch(e){
      d.saving = false;
      toast("We couldn't save your changes. Please try again.");
      renderEditProfileModal();
    }
  }, 250);
}
